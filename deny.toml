[graph]
all-features = true

[advisories]
# Temporary RC-development exceptions. oxrdfxml 0.1.7/0.2.3 pins
# quick-xml 0.37.5; remove both entries as soon as the Oxigraph RDF/XML crates
# publish a release that accepts quick-xml >=0.41. Publication preflight runs
# cargo-audit without this allow-list, so these cannot be silently shipped.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "Blocked on a crates.io oxrdfxml release using quick-xml >=0.41" },
  { id = "RUSTSEC-2026-0195", reason = "Blocked on a crates.io oxrdfxml release using quick-xml >=0.41" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
