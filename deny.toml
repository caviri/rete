[graph]
all-features = true

[advisories]
# Temporary exceptions. Every published oxrdfxml/sparesults still requires
# quick-xml ^0.37; remove both entries as soon as Oxigraph publishes a release
# that accepts quick-xml >=0.41. Both findings are availability-only DoS
# reachable through untrusted RDF/XML input. The rationale, review date and the
# exceptions of every other lockfile live in lockfile-audit.toml, the one list;
# scripts/audit_lockfiles.py fails when this ignore list stops matching that
# file's exceptions for the workspace lockfile (".").
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "Blocked on a crates.io oxrdfxml release using quick-xml >=0.41" },
  { id = "RUSTSEC-2026-0195", reason = "Blocked on a crates.io oxrdfxml release using quick-xml >=0.41" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
