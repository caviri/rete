# The R binding crate — OUTSIDE the cargo workspace (see the root Cargo.toml
# `exclude`), like clients/python: it versions and locks independently and is
# built by R's Makevars via cargo, never published to crates.io.
[package]
name = 'rete'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.87'

[lib]
# staticlib is what R's Makevars links; rlib lets the `document` metadata bin
# link against the same crate.
crate-type = ['staticlib', 'rlib']
name = 'rete'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
# Pinned to the 0.8 line: rextendr 0.5's generated plumbing (entrypoint.c,
# wrapper conventions) targets it; 0.9 changed the #[extendr] macro contract.
extendr-api = '0.8'
# `http` is rete-core's HTTP(S) range reader, shared with the CLI and the
# Python client (rustls via ureq's `tls` feature — no system OpenSSL on any
# platform).
rete-core = { path = '../../../../crates/rete-core', features = ['http'] }
serde_json = '1'

# `parallel` (rayon) spreads `rete_build()`'s sorts and compression, and a
# query's dictionary decodes, over every core; the bytes are the serial build's.
# Native only: a webR (emscripten) build has no threads. R calls into the engine
# on its main thread and has no lock to release around them, so the threads
# are the engine's own and R stays blocked for the call, as before.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rete-core = { path = '../../../../crates/rete-core', features = ['http', 'parallel'] }

[profile.release]
lto = true
codegen-units = 1
