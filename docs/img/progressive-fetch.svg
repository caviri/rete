<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">overview-first fetch: three small range requests pull header, dictionary and summary; the large index is never fetched</title>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">Overview first — 3 range reads, ~25% of the file</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="40" y="150" width="150" height="110" rx="10" fill="#0f1620"/>
  <text x="115" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Client</text>
  <text x="115" y="216" text-anchor="middle" font-size="11.5" fill="#c9d4e0">browser / CLI</text>
  <text x="115" y="234" text-anchor="middle" font-size="11.5" fill="#c9d4e0">summary-url</text>

  <!-- File column on right -->
  <text x="555" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">file.rete on any HTTP host</text>

  <!-- HEADER (fetched) -->
  <rect x="450" y="76" width="210" height="34" rx="5" fill="#2a6df4"/>
  <text x="465" y="98" font-size="12.5" font-weight="700" fill="#ffffff">HEADER  (128 B)</text>

  <!-- DICTIONARY (fetched) -->
  <rect x="450" y="116" width="210" height="48" rx="5" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="465" y="145" font-size="12.5" font-weight="700" fill="#1b3a8a">DICTIONARY</text>

  <!-- INDEX (greyed, never fetched) -->
  <rect x="450" y="170" width="210" height="120" rx="5" fill="#f5f7f9" stroke="#e4e8ec" stroke-dasharray="5 4"/>
  <text x="555" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#a3adb8">INDEX (SPO/POS/OSP)</text>
  <text x="555" y="248" text-anchor="middle" font-size="12" fill="#a3adb8">never fetched</text>

  <!-- SUMMARY (fetched) -->
  <rect x="450" y="296" width="210" height="48" rx="5" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="465" y="325" font-size="12.5" font-weight="700" fill="#1b3a8a">PYRAMID SUMMARY</text>

  <!-- Range request arrows -->
  <g stroke="#2a6df4" stroke-width="1.8" fill="none">
    <path d="M196,168 C320,120 360,96 444,93" marker-end="url(#a)"/>
    <path d="M196,188 C330,160 360,142 444,140" marker-end="url(#a)"/>
    <path d="M196,228 C330,300 360,320 444,320" marker-end="url(#a)"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#2a6df4">
    <text x="250" y="118">1 · Range bytes=0-127</text>
    <text x="250" y="168">2 · Range: dictionary</text>
    <text x="250" y="296">3 · Range: summary</text>
  </g>

  <text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#5b6570">The client computes the coarse community graph from ~25% of the file — the big index stays on the server.</text>
</svg>
