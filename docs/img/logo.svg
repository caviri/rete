<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t">
  <title id="t">rete — a queryable RDF graph in a single file, no server</title>
  <style>
    /* The mark keeps its brand blue in both themes; only the tagline, which was
       #5b6570 and unreadable on a dark page, follows the color scheme. */
    :root{ --muted:#5b6570; }
    @media (prefers-color-scheme:dark){ :root{ --muted:#98a4b1; } }
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
  </style>

  <!-- icon: a graph (network) packed inside one rounded "file" tile -->
  <rect x="24" y="40" width="120" height="120" rx="28" fill="#2a6df4"/>
  <g stroke="#dce8ff" stroke-width="3" fill="none" opacity="0.95">
    <path d="M84 76 L56 116"/>
    <path d="M84 76 L112 116"/>
    <path d="M56 116 L112 116"/>
    <path d="M56 116 L84 142"/>
    <path d="M112 116 L84 142"/>
  </g>
  <g fill="#ffffff">
    <circle cx="84" cy="74" r="11"/>
    <circle cx="54" cy="117" r="9"/>
    <circle cx="114" cy="117" r="9"/>
    <circle cx="84" cy="143" r="8"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="176" y="118" font-size="86" font-weight="800" fill="#2a6df4" letter-spacing="-2">rete</text>
  <text class="u-muted" x="180" y="150" font-size="19">a queryable RDF graph in a single file — no server</text>
</svg>
