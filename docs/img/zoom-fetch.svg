<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">Reading the schema pyramid over HTTP: a range client fetches only the header, dictionary, and pyramid-meta ranges to get the whole leveled type legend. The large triple index is never fetched.</title>
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">Index-free: what summary-url fetches</text>

  <!-- Client -->
  <rect x="280" y="52" width="160" height="40" rx="8" fill="#0f1620"/>
  <text x="360" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">range client (HTTP)</text>

  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>

  <!-- Fetch arrows to the three small sections -->
  <g stroke="#2a6df4" stroke-width="1.8" fill="none" marker-end="url(#dn)">
    <path d="M310,92 L90,168"/>
    <path d="M345,92 L235,168"/>
    <path d="M430,92 L600,168"/>
  </g>

  <!-- On-disk section strip -->
  <g font-size="12.5" font-weight="700">
    <!-- HEADER -->
    <rect x="40" y="172" width="100" height="56" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="90" y="197" text-anchor="middle" fill="#0f2347">HEADER</text>
    <text x="90" y="214" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6570">128 B</text>

    <!-- DICTIONARY -->
    <rect x="148" y="172" width="150" height="56" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="223" y="197" text-anchor="middle" fill="#0f2347">DICTIONARY</text>
    <text x="223" y="214" text-anchor="middle" font-size="10" font-weight="400" fill="#5b6570">term labels</text>

    <!-- INDEX (skipped) -->
    <rect x="306" y="172" width="230" height="56" rx="7" fill="#f5f7f9" stroke="#cdd7e2" stroke-dasharray="5 4"/>
    <text x="421" y="195" text-anchor="middle" fill="#9aa4af">TRIPLE INDEX</text>
    <text x="421" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">✗ never fetched</text>

    <!-- PYRAMID-META (accent, fetched) -->
    <rect x="544" y="172" width="136" height="56" rx="7" fill="#2a6df4"/>
    <text x="612" y="195" text-anchor="middle" fill="#ffffff">PYRAMID-META</text>
    <text x="612" y="213" text-anchor="middle" font-size="10" font-weight="400" fill="#cfe0fb">summary + schema pyramid</text>
  </g>

  <!-- Caption -->
  <rect x="40" y="252" width="640" height="56" rx="8" fill="#f5f7f9" stroke="#e4e8ec"/>
  <text x="360" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1f24">the whole leveled legend in ~a few KB · 3 range requests · the index stays on the server</text>
  <text x="360" y="294" text-anchor="middle" font-size="11" fill="#5b6570">bytes-on-the-wire scale with the number of classes, not the size of the graph</text>
</svg>
