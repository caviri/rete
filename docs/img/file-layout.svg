<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="t">
  <title id="t">The front of a format 0x06 .rete file. A 128-byte header comes first, then the root block with the section table, then the card region holding the Dataset Card, the build record and free space, then the front sections (statistics, schema and the leaf directories), then the data sections, then an 8-byte footer. The header is drawn to scale in six groups: bytes 0 to 7 magic, version, flags and header length; 8 to 23 the content hash; 24 to 47 the file length, root length, card region length and data offset; 48 to 71 the statement, term and named-graph counts; 72 to 79 the permutation mask, codecs, pyramid levels, id widths and presence bits; 80 to 127 the card and build record positions, the card digest and the root digest. A reader's first request, bytes 0 to 65535, holds the header, the root, the card and the statistics.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    .u-dataink{fill:var(--data-ink)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .chip{font-size:12px;font-weight:700;fill:var(--on-chip)}
    .cold{fill:var(--cold);stroke:var(--line)}
    .lead{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:4 3}
  </style>

  <rect x="1" y="1" width="558" height="468" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">The front of the file is the directory</text>
  <text class="deck" x="26" y="62">the first 128 KiB read holds everything a reader needs to plan a query</text>

  <!-- ============ the file, in order (not to scale) ============ -->
  <text class="sect" x="26" y="100">the file, in order — <tspan class="mono">not to scale</tspan></text>
  <rect x="26"  y="110" width="62"  height="34" rx="4" fill="var(--meta)"/>
  <rect x="88"  y="110" width="54"  height="34" rx="4" fill="var(--meta)" opacity="0.75"/>
  <rect x="142" y="110" width="80"  height="34" rx="4" fill="var(--meta)" opacity="0.55"/>
  <rect x="222" y="110" width="92" height="34" rx="4" fill="var(--meta)" opacity="0.4"/>
  <rect x="314" y="110" width="168" height="34" rx="4" fill="var(--data)"/>
  <rect x="482" y="110" width="52"  height="34" rx="4" class="cold"/>
  <g class="chip" text-anchor="middle">
    <text x="57"  y="125">header</text><text x="57"  y="138" font-weight="400">128 B</text>
    <text x="115" y="125">root</text><text x="115" y="138" font-weight="400">sections</text>
    <text x="182" y="125">card region</text><text x="182" y="138" font-weight="400">card · record</text>
    <text x="268" y="125">front sections</text><text x="268" y="138" font-weight="400">stats · leaves</text>
    <text x="398" y="125">data sections</text><text x="398" y="138" font-weight="400">dict · tiles · labels · text</text>
  </g>
  <text class="ann" x="508" y="131" text-anchor="middle">footer</text>
  <!-- the first read -->
  <path d="M26 154 v8 H314 v-8" fill="none" stroke="var(--meta)" stroke-width="1.5"/>
  <text class="mono body u-metaink" x="170" y="180" text-anchor="middle" font-weight="700">first read: bytes=0-65535</text>
  <text class="ann" x="398" y="164" text-anchor="middle">fetched when a query needs it</text>
  <text class="ann" x="26" y="204">The header holds the file length, so no <tspan class="mono">HEAD</tspan> is needed. The footer is <tspan class="mono">06 00 00 00 "RETE"</tspan>.</text>

  <!-- ============ the header, to scale ============ -->
  <text class="sect" x="26" y="244">the header — <tspan class="mono">bytes 0–127</tspan>, drawn to scale</text>
  <g>
    <rect x="26"    y="254" width="31.75"  height="22" rx="3" fill="var(--meta)"/>
    <rect x="57.75" y="254" width="63.5"   height="22" rx="3" fill="var(--data)"/>
    <rect x="121.25" y="254" width="95.25" height="22" rx="3" fill="var(--meta)" opacity="0.7"/>
    <rect x="216.5" y="254" width="95.25"  height="22" rx="3" fill="var(--data)" opacity="0.7"/>
    <rect x="311.75" y="254" width="31.75" height="22" rx="3" fill="var(--meta)" opacity="0.55"/>
    <rect x="343.5" y="254" width="190.5"  height="22" rx="3" fill="var(--data)" opacity="0.5"/>
  </g>
  <g class="mono" font-size="12" text-anchor="middle">
    <text class="u-onchip" x="41.9"  y="269">0</text>
    <text class="u-onchip" x="89.5"  y="269">8</text>
    <text class="u-onchip" x="168.9" y="269">24</text>
    <text class="u-onchip" x="264.1" y="269">48</text>
    <text class="u-onchip" x="327.6" y="269">72</text>
    <text class="u-onchip" x="438.8" y="269">80</text>
  </g>
  <g class="mono" font-size="13">
    <text class="ann" x="26" y="304">bytes</text>
    <text class="ann" x="92" y="304">holds</text>

    <text class="u-metaink" x="26" y="326">0–7</text>
    <text x="92" y="326">magic, version, flags, header length</text>
    <text class="u-dataink" x="26" y="346">8–23</text>
    <text x="92" y="346">content hash</text>
    <text class="u-metaink" x="26" y="366">24–47</text>
    <text x="92" y="366">file length, root length, card region length, data offset</text>
    <text class="u-dataink" x="26" y="386">48–71</text>
    <text x="92" y="386">statement, term, named-graph counts</text>
    <text class="u-metaink" x="26" y="406">72–79</text>
    <text x="92" y="406">permutation mask, codecs, levels, id widths, presence</text>
    <text class="u-dataink" x="26" y="426">80–127</text>
    <text x="92" y="426">card and record position, card digest, root digest</text>
  </g>

  <text class="ann" x="26" y="454">Re-carding rewrites the card region and these 128 bytes, and nothing else.</text>
</svg>
