<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">rete on-disk file layout: a 1 KB header that holds the offset of every section</title>
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">On-disk layout — the header is the directory</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>

  <!-- HEADER block (accent) -->
  <rect x="360" y="56" width="300" height="48" rx="6" fill="#2a6df4"/>
  <text x="510" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">HEADER</text>
  <text x="510" y="96" text-anchor="middle" font-size="11.5" fill="#dce8ff">fixed 1 KB · read first · a typed directory of every section's offset+length</text>

  <!-- Section blocks -->
  <g font-size="13.5" font-weight="600">
    <rect x="360" y="124" width="300" height="44" rx="6" fill="#f5f7f9" stroke="#e4e8ec"/>
    <text x="376" y="151" fill="#1b1f24">DICTIONARY</text>
    <text x="644" y="151" text-anchor="end" font-size="11" font-weight="400" fill="#5b6570">front-coded · 4 sections</text>

    <rect x="360" y="176" width="300" height="44" rx="6" fill="#f5f7f9" stroke="#e4e8ec"/>
    <text x="376" y="203" fill="#1b1f24">INDEX</text>
    <text x="644" y="203" text-anchor="end" font-size="11" font-weight="400" fill="#5b6570">SPO / POS / OSP</text>

    <rect x="360" y="228" width="300" height="44" rx="6" fill="#f5f7f9" stroke="#e4e8ec"/>
    <text x="376" y="255" fill="#1b1f24">PYRAMID META</text>
    <text x="644" y="255" text-anchor="end" font-size="11" font-weight="400" fill="#5b6570">community summary</text>

    <rect x="360" y="280" width="300" height="44" rx="6" fill="#f5f7f9" stroke="#e4e8ec" stroke-dasharray="4 3"/>
    <text x="376" y="307" fill="#1b1f24">NAMED GRAPHS</text>
    <text x="644" y="307" text-anchor="end" font-size="11" font-weight="400" fill="#5b6570">optional · quads</text>

    <rect x="360" y="332" width="300" height="44" rx="6" fill="#0f1620"/>
    <text x="376" y="359" fill="#ffffff">FOOTER</text>
    <text x="644" y="359" text-anchor="end" font-size="11" font-weight="400" fill="#c9d4e0">4-byte RETE magic</text>
  </g>

  <!-- Arrows from header to each section -->
  <g stroke="#2a6df4" stroke-width="1.6" fill="none">
    <path d="M360,92 C300,100 300,140 354,146" marker-end="url(#a)"/>
    <path d="M360,96 C260,110 250,190 354,198" marker-end="url(#a)"/>
    <path d="M360,100 C230,118 215,242 354,250" marker-end="url(#a)"/>
    <path d="M360,102 C205,126 195,294 354,302" marker-end="url(#a)"/>
    <path d="M360,104 C185,134 180,346 354,354" marker-end="url(#a)"/>
  </g>

  <text x="170" y="420" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2a6df4">one 1 KB read</text>
  <text x="170" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2a6df4">locates everything</text>

  <text x="510" y="424" text-anchor="middle" font-size="12.5" fill="#5b6570">No separate directory to chase — every offset+length lives in the header.</text>
</svg>
