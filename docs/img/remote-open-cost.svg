<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t">
  <title id="t">What a cold remote open costs, measured with rete cost on the published davidrumsey.rete — 74.8 MB, 5,001,983 triples. Each track is the whole file; the solid part is what crosses the wire. Reading the dataset card costs 2 requests and 61 KB, 0.08 percent. Opening lazily for a query costs 65 requests and 407 KB, 0.54 percent, because only tile directories are read. But routing one triple pattern costs 2 requests and 16.1 MB, 21.5 percent, and the overview costs 3 requests and 17.4 MB, 23.3 percent — both because resolving a term to an id pulls the whole dictionary, whose chunk directory stores every chunk's first term verbatim. Reading the file whole costs 74.7 MB, 99.9 percent.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .meas{font-size:13px;font-weight:700}
    .ann{font-size:13px;fill:var(--muted)}
    .track{fill:var(--cold);stroke:var(--line)}
  </style>

  <rect x="1" y="1" width="558" height="558" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">What a cold open actually costs</text>
  <text class="deck" x="26" y="62">every track is the whole file — the solid part is what crosses the wire</text>

  <rect x="26" y="76" width="164" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="40" y="95" font-weight="700">davidrumsey.rete</text>
  <text class="ann" x="202" y="95">74.8 MB · 5,001,983 triples</text>

  <text class="sect" x="26" y="140">tier</text>
  <text class="sect" x="412" y="140">requests · bytes</text>

  <!-- ================= tier rows: track 152..412 (260px) = 74,803,250 B ============ -->

  <!-- 1. card -->
  <text class="body" x="26" y="168" font-weight="700">dataset card</text>
  <rect class="track" x="152" y="152" width="260" height="20" rx="4"/>
  <rect x="152" y="152" width="3" height="20" rx="1.5" fill="var(--meta)"/>
  <text class="meas" x="534" y="168" text-anchor="end">2 · 61 KB</text>
  <text class="ann" x="26" y="186">rete card-url — index never touched</text>
  <text class="meas u-dataink" x="534" y="186" text-anchor="end">0.08%</text>

  <!-- 2. lazy query open -->
  <text class="body" x="26" y="222" font-weight="700">lazy query open</text>
  <rect class="track" x="152" y="206" width="260" height="20" rx="4"/>
  <rect x="152" y="206" width="3" height="20" rx="1.5" fill="var(--data)"/>
  <text class="meas" x="534" y="222" text-anchor="end">65 · 407 KB</text>
  <text class="ann" x="26" y="240">tile directories only; tiles fault in per scan</text>
  <text class="meas u-dataink" x="534" y="240" text-anchor="end">0.54%</text>

  <!-- 3. routed pattern -->
  <text class="body" x="26" y="276" font-weight="700">one routed pattern</text>
  <rect class="track" x="152" y="260" width="260" height="20" rx="4"/>
  <rect x="152" y="260" width="56" height="20" rx="4" fill="var(--meta)"/>
  <text class="meas" x="534" y="276" text-anchor="end">2 · 16.1 MB</text>
  <text class="ann" x="26" y="294">term → id: pulls the whole dictionary</text>
  <text class="meas u-warn" x="534" y="294" text-anchor="end">21.5%</text>

  <!-- 4. summary overview -->
  <text class="body" x="26" y="330" font-weight="700">overview / summary</text>
  <rect class="track" x="152" y="314" width="260" height="20" rx="4"/>
  <rect x="152" y="314" width="61" height="20" rx="4" fill="var(--meta)"/>
  <text class="meas" x="534" y="330" text-anchor="end">3 · 17.4 MB</text>
  <text class="ann" x="26" y="348">pyramid is 1.3 MB — the dictionary is the rest</text>
  <text class="meas u-warn" x="534" y="348" text-anchor="end">23.3%</text>

  <!-- 5. full open -->
  <text class="body" x="26" y="384" font-weight="700">read it whole</text>
  <rect class="track" x="152" y="368" width="260" height="20" rx="4"/>
  <rect x="152" y="368" width="260" height="20" rx="4" fill="var(--ink)"/>
  <text class="meas" x="534" y="384" text-anchor="end">5 · 74.7 MB</text>
  <text class="ann" x="26" y="402">what a non-range client has to do</text>
  <text class="meas" x="534" y="402" text-anchor="end">99.9%</text>

  <!-- ================= the dictionary tax ============ -->
  <rect x="26" y="424" width="508" height="112" rx="12" fill="var(--panel)" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="body u-warn" x="42" y="448" font-weight="700">Why the middle two cost 200× the lazy open</text>
  <text class="body" x="42" y="470">The dictionary's chunk directory stores <tspan font-weight="700">every chunk's first term verbatim</tspan>,</text>
  <text class="body" x="42" y="488">so a term lookup that should read one 64 KiB chunk reads the directory first.</text>
  <text class="ann" x="42" y="510">On epfl-infoscience that directory is 234 MB. PR #199 stopped reading it two to</text>
  <text class="ann" x="42" y="528">four times per open (−53.5%); storing a separator instead is still open — #198.</text>
</svg>
