<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">rete pyramid: progressive community summarization, overview first then drill down</title>
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">The pyramid — overview first, drill down on demand</text>

  <!-- Level 2: coarse summary -->
  <polygon points="360,64 300,124 420,124" fill="#2a6df4" opacity="0.92"/>
  <g fill="#ffffff" stroke="#ffffff">
    <circle cx="345" cy="108" r="7"/>
    <circle cx="375" cy="108" r="7"/>
    <line x1="352" y1="108" x2="368" y2="108" stroke-width="2"/>
  </g>
  <text x="486" y="98" font-size="13" font-weight="700" fill="#1b1f24">Level 2 — community summary</text>
  <text x="486" y="116" font-size="12" fill="#5b6570">a few super-nodes (quotient graph)</text>

  <!-- Level 1: communities -->
  <polygon points="300,128 420,128 462,224 258,224" fill="#5a8df6" opacity="0.92"/>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.6">
    <line x1="300" y1="182" x2="345" y2="160"/>
    <line x1="345" y1="160" x2="390" y2="182"/>
    <line x1="390" y1="182" x2="420" y2="160"/>
    <circle cx="300" cy="182" r="6"/><circle cx="345" cy="160" r="6"/>
    <circle cx="390" cy="182" r="6"/><circle cx="420" cy="160" r="6"/>
    <circle cx="360" cy="200" r="6"/>
  </g>
  <text x="486" y="178" font-size="13" font-weight="700" fill="#1b1f24">Level 1 — communities</text>
  <text x="486" y="196" font-size="12" fill="#5b6570">more nodes, aggregated edges</text>

  <!-- Level 0: full triples -->
  <polygon points="258,228 462,228 528,420 192,420" fill="#0f1620" opacity="0.92"/>
  <g fill="#ffffff" stroke="#8fb0f7" stroke-width="1.2">
    <line x1="240" y1="300" x2="290" y2="270"/><line x1="290" y1="270" x2="340" y2="305"/>
    <line x1="340" y1="305" x2="300" y2="350"/><line x1="300" y1="350" x2="240" y2="300"/>
    <line x1="340" y1="305" x2="400" y2="278"/><line x1="400" y1="278" x2="450" y2="320"/>
    <line x1="450" y1="320" x2="400" y2="370"/><line x1="400" y1="370" x2="340" y2="305"/>
    <line x1="300" y1="350" x2="360" y2="385"/><line x1="360" y1="385" x2="400" y2="370"/>
    <line x1="290" y1="270" x2="400" y2="278"/>
    <g fill="#ffffff" stroke="none">
      <circle cx="240" cy="300" r="5"/><circle cx="290" cy="270" r="5"/><circle cx="340" cy="305" r="5"/>
      <circle cx="300" cy="350" r="5"/><circle cx="400" cy="278" r="5"/><circle cx="450" cy="320" r="5"/>
      <circle cx="400" cy="370" r="5"/><circle cx="360" cy="385" r="5"/>
      <circle cx="475" cy="360" r="5"/><circle cx="220" cy="345" r="5"/><circle cx="270" cy="400" r="5"/>
    </g>
  </g>
  <text x="552" y="318" font-size="13" font-weight="700" fill="#1b1f24">Level 0 — full triples</text>
  <text x="552" y="336" font-size="12" fill="#5b6570">every node &amp; edge, the whole graph</text>

  <!-- Right arrow: overview first -> drill down -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>
  <line x1="660" y1="80" x2="660" y2="408" stroke="#2a6df4" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="676" y="140" font-size="12" font-weight="600" fill="#2a6df4" transform="rotate(90 676 140)">overview first  →  drill down where needed</text>

  <!-- Left axis: bytes / detail -->
  <line x1="120" y1="408" x2="120" y2="80" stroke="#5b6570" stroke-width="2" marker-end="url(#arm)"/>
  <defs>
    <marker id="arm" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
  </defs>
  <text x="104" y="120" font-size="12" font-weight="600" fill="#5b6570" transform="rotate(-90 104 120)">fewer bytes  ↑</text>
  <text x="104" y="408" font-size="12" font-weight="600" fill="#5b6570" transform="rotate(-90 104 408)">more detail  ↓</text>

  <text x="360" y="458" text-anchor="middle" font-size="12.5" fill="#5b6570">A client reads the top first and descends only into the regions it needs.</text>
</svg>
