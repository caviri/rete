<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" role="img" aria-labelledby="t">
  <title id="t">The pyramid stores a graph at several levels of detail so a client can read an overview before touching the data. Level 0 at the top is the coarsest: a handful of supernodes with aggregated edges. Middle levels split those into finer communities, each tile targeted at about 64 KiB so one zoom is one range read. Level N-1 at the base is the full triple graph, fetched only where a query drills in. On the published davidrumsey.rete the whole pyramid is 1,332,512 bytes — 1.8 percent of the 74.8 MB file — so the overview is cheap and the base is not.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --meta:#a259f7; --meta-ink:#7a2fe0;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --meta:#a978f7; --meta-ink:#c6a4ff;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .cold{fill:var(--cold);stroke:var(--line)}
    .lead{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:4 3}
    .gline{fill:none;stroke:var(--on-chip);stroke-width:1.6}
    .gdot{fill:var(--on-chip);stroke:none}
    .cline{fill:none;stroke:var(--coldfg);stroke-width:1.2}
    .cdot{fill:var(--coldfg);stroke:none}
    /* colour utilities must beat the base text{fill} rule, so they come last */
    .metaink{fill:var(--meta-ink)}
  </style>

  <rect x="1" y="1" width="558" height="422" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Overview first, drill down on demand</text>
  <text class="deck" x="26" y="62">the pyramid: read the top, descend only where the query needs it</text>

  <rect x="26" y="76" width="164" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="40" y="95" font-weight="700">davidrumsey.rete</text>
  <text class="ann" x="202" y="95">pyramid 1.33 MB of 74.8 MB</text>

  <!-- ============ level 0 — the summary ============ -->
  <polygon points="150,116 112,164 188,164" fill="var(--meta)"/>
  <path class="gline" d="M140,148 L161,148"/>
  <g class="gdot">
    <circle cx="140" cy="148" r="4.5"/>
    <circle cx="161" cy="148" r="4.5"/>
  </g>
  <path class="lead" d="M172,140 H282"/>
  <text class="sect" x="288" y="136">Level 0 — the summary</text>
  <text class="ann"  x="288" y="154">a few supernodes, edges rolled up</text>

  <!-- ============ middle levels ============ -->
  <polygon points="108,168 192,168 224,232 76,232" fill="var(--meta)" opacity="0.5"/>
  <path class="gline" d="M110,192 L140,184 L170,192 M110,192 L140,212 L170,192"/>
  <g class="gdot">
    <circle cx="110" cy="192" r="4.5"/>
    <circle cx="140" cy="184" r="4.5"/>
    <circle cx="170" cy="192" r="4.5"/>
    <circle cx="140" cy="212" r="4.5"/>
  </g>
  <path class="lead" d="M212,200 H282"/>
  <text class="sect" x="288" y="196">middle levels — 1 to N-2</text>
  <text class="ann"  x="288" y="214">each tile targeted at ~64 KiB</text>
  <text class="ann"  x="288" y="232">one zoom = one range read</text>

  <!-- ============ level N-1 — the full graph ============ -->
  <polygon points="72,236 228,236 268,326 32,326" class="cold" stroke-dasharray="5 4"/>
  <g class="cline">
    <path d="M80,258 L112,250 L146,262 L180,252 L212,264"/>
    <path d="M96,288 L134,292 L172,286 L210,294"/>
    <path d="M112,250 L134,292 M146,262 L172,286 M126,314 L96,288 M126,314 L172,286 M186,314 L210,294"/>
  </g>
  <g class="cdot">
    <circle cx="80"  cy="258" r="4"/><circle cx="112" cy="250" r="4"/>
    <circle cx="146" cy="262" r="4"/><circle cx="180" cy="252" r="4"/>
    <circle cx="212" cy="264" r="4"/><circle cx="96"  cy="288" r="4"/>
    <circle cx="134" cy="292" r="4"/><circle cx="172" cy="286" r="4"/>
    <circle cx="210" cy="294" r="4"/><circle cx="126" cy="314" r="4"/>
    <circle cx="186" cy="314" r="4"/>
  </g>
  <path class="lead" d="M252,278 H282"/>
  <text class="sect" x="288" y="274">Level N-1 — the full graph</text>
  <text class="ann"  x="288" y="292">every triple, nothing rolled up</text>
  <text class="ann"  x="288" y="310">never fetched unless you drill</text>

  <text class="ann" x="26" y="356">The whole pyramid is 1.8% of the file: the overview is cheap, the base is not.</text>

  <!-- takeaway -->
  <rect x="26" y="370" width="508" height="38" rx="12" fill="var(--panel)" stroke="var(--meta)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body metaink" x="40" y="394" font-weight="700">rete summary</text>
  <text class="body" x="136" y="394">reads the top — the triple index is never touched</text>
</svg>
