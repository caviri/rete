<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">An RDF triple: subject — predicate → object</title>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">An RDF triple: subject — predicate → object</text>
  <text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#5b6570">resources are rounded nodes; literals are rectangles</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
  </defs>

  <!-- Row 1: resource object -->
  <rect x="80" y="92" width="150" height="56" rx="28" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="155" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1b3a8a">:Alice</text>

  <rect x="490" y="92" width="150" height="56" rx="28" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="565" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1b3a8a">:Bob</text>

  <path d="M232,120 L486,120" stroke="#5b6570" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="360" y="110" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2a6df4">:knows</text>

  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#5b6570">subject</text>
  <text x="360" y="172" text-anchor="middle" font-size="11" fill="#5b6570">predicate</text>
  <text x="565" y="172" text-anchor="middle" font-size="11" fill="#5b6570">object (resource)</text>

  <!-- Row 2: literal object -->
  <rect x="80" y="196" width="150" height="56" rx="28" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="155" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#1b3a8a">:Alice</text>

  <rect x="490" y="196" width="150" height="56" rx="8" fill="#f5f7f9" stroke="#5b6570"/>
  <text x="565" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1f24">"30"</text>

  <path d="M232,224 L486,224" stroke="#5b6570" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="360" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2a6df4">:age</text>
  <text x="565" y="276" text-anchor="middle" font-size="11" fill="#5b6570">object (literal)</text>

  <text x="360" y="294" text-anchor="middle" font-size="12.5" fill="#5b6570">Every edge is one fact (a triple). A graph is just many triples sharing nodes.</text>
</svg>
