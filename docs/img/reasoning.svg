<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">OWL/RDFS reasoning: asserted triples plus a subClassOf rule infer an implicit type triple, while a disjointWith clash surfaces as an incoherent point</title>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">OWL/RDFS reasoning: infer the implicit, flag the incoherent</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="130" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">Asserted</text>
  <text x="670" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">Inferred</text>

  <!-- Asserted triples (left) -->
  <rect x="40" y="86" width="220" height="40" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="52" y="111" font-size="12.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#1b3a8a">:Cat rdfs:subClassOf :Animal</text>

  <rect x="40" y="136" width="220" height="40" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="52" y="161" font-size="12.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#1b3a8a">:Felix rdf:type :Cat</text>

  <!-- Rule box (middle) -->
  <rect x="305" y="100" width="190" height="62" rx="8" fill="#0f1620"/>
  <text x="400" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">rule</text>
  <text x="400" y="146" text-anchor="middle" font-size="11.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#c9d4e0">subClassOf + type ⇒ type</text>

  <!-- Inferred box (right, dashed) -->
  <rect x="540" y="111" width="220" height="40" rx="8" fill="#ffffff" stroke="#2a6df4" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="552" y="136" font-size="12.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#2a6df4">:Felix rdf:type :Animal</text>

  <!-- arrows asserted -> rule -> inferred -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M260,106 C285,110 290,120 301,124" marker-end="url(#a)"/>
    <path d="M260,156 C285,150 290,142 301,138" marker-end="url(#a)"/>
  </g>
  <g stroke="#2a6df4" stroke-width="1.5" fill="none">
    <path d="M495,131 L534,131" marker-end="url(#b)"/>
  </g>

  <!-- Incoherence example -->
  <rect x="40" y="216" width="240" height="40" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="52" y="241" font-size="12.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#1b3a8a">:Animal owl:disjointWith :Plant</text>

  <rect x="40" y="266" width="240" height="40" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="52" y="291" font-size="12.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#1b3a8a">:Felix rdf:type :Plant</text>

  <!-- Red incoherent box -->
  <rect x="430" y="236" width="330" height="50" rx="8" fill="#fde8ec" stroke="#c2334d" stroke-width="1.8"/>
  <text x="595" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#c2334d">✗ incoherent</text>
  <text x="595" y="277" text-anchor="middle" font-size="11.5" fill="#c2334d">Felix is Animal AND Plant</text>

  <!-- arrows incoherence -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M280,236 C350,240 380,250 424,256" marker-end="url(#a)"/>
    <path d="M280,286 C350,282 380,272 424,266" marker-end="url(#a)"/>
  </g>

  <text x="400" y="350" text-anchor="middle" font-size="12.5" fill="#5b6570">Forward-chaining materializes entailed triples; disjointness/domain clashes surface as incoherent points.</text>
</svg>
