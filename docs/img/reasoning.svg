<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 556" role="img" aria-labelledby="t">
  <title id="t">Two things a reasoner does to a .rete file. Above: two asserted triples — Cat is a subClassOf Animal, and Felix has type Cat — meet the RDFS rule subClassOf plus type gives type, and forward chaining writes the entailed triple Felix has type Animal, which nobody stated. Below: adding the axiom Animal is disjointWith Plant and the assertion Felix has type Plant makes the same closure contradict itself, and rete reason reports it as an incoherent point and exits non-zero, so it works as a CI gate.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --data:#2bb673; --data-ink:#17794a;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .box{fill:var(--panel);stroke:var(--line)}
    .flow{stroke:var(--muted);stroke-width:1.8;fill:none}
    /* colour utilities must beat the base text{fill} rule, so they come last */
    .onink{fill:var(--surface)}
    .dataink{fill:var(--data-ink)}
    .warntx{fill:var(--warn)}
    .mutedtx{fill:var(--muted)}
  </style>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="554" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Infer the implicit, flag the incoherent</text>
  <text class="deck" x="26" y="62">forward-chain RDFS / OWL RL to a fixpoint, then scan the closed graph</text>

  <!-- ============ inference ============ -->
  <text class="sect" x="26" y="104">what the file says</text>

  <rect class="box" x="26" y="114" width="384" height="34" rx="7"/>
  <text class="mono body" x="40" y="136">:Cat rdfs:subClassOf :Animal</text>
  <text class="ann" x="424" y="136">asserted</text>

  <text class="body mutedtx" x="218" y="161" text-anchor="middle" font-weight="700">+</text>

  <rect class="box" x="26" y="164" width="384" height="34" rx="7"/>
  <text class="mono body" x="40" y="186">:Felix rdf:type :Cat</text>
  <text class="ann" x="424" y="186">asserted</text>

  <path class="flow" d="M218,200 L218,212" marker-end="url(#a)"/>

  <rect x="26" y="216" width="384" height="34" rx="7" fill="var(--ink)"/>
  <text class="body onink" x="40" y="238" font-weight="700">rule</text>
  <text class="mono body onink" x="86" y="238">subClassOf + type =&gt; type</text>
  <text class="ann" x="424" y="238">OWL RL</text>

  <path class="flow" d="M218,252 L218,264" marker-end="url(#a)"/>

  <rect x="26" y="268" width="384" height="34" rx="7" fill="var(--panel)" stroke="var(--data)" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text class="mono body dataink" x="40" y="290" font-weight="700">:Felix rdf:type :Animal</text>
  <text class="body dataink" x="424" y="290" font-weight="700">inferred</text>

  <text class="ann" x="26" y="324">Nobody wrote that triple; it follows from the two above.</text>

  <!-- ============ incoherence ============ -->
  <text class="sect" x="26" y="360">what the same closure exposes</text>

  <rect class="box" x="26" y="370" width="384" height="34" rx="7"/>
  <text class="mono body" x="40" y="392">:Animal owl:disjointWith :Plant</text>
  <text class="ann" x="424" y="392">asserted</text>

  <text class="body mutedtx" x="218" y="417" text-anchor="middle" font-weight="700">+</text>

  <rect class="box" x="26" y="420" width="384" height="34" rx="7"/>
  <text class="mono body" x="40" y="442">:Felix rdf:type :Plant</text>
  <text class="ann" x="424" y="442">asserted</text>

  <path class="flow" d="M218,456 L218,468" marker-end="url(#a)"/>

  <rect x="26" y="472" width="508" height="52" rx="12" fill="var(--panel)" stroke="var(--warn)" stroke-width="1.8"/>
  <g stroke="var(--warn)" stroke-width="1.8" fill="none">
    <circle cx="50" cy="490" r="8"/>
    <path d="M45.5,485.5 L54.5,494.5 M54.5,485.5 L45.5,494.5"/>
  </g>
  <text class="body warntx" x="68" y="495" font-weight="700">incoherent point</text>
  <text class="body" x="68" y="515">:Felix would be both :Animal and :Plant, and those are disjoint.</text>

  <text class="ann" x="26" y="542"><tspan class="mono">rete reason</tspan> exits non-zero when it finds one — it drops straight into CI.</text>
</svg>
