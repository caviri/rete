<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="t">
  <title id="t">The same three facts drawn twice. On the left a friendship table with a person and knows column and three rows: Alice knows Bob, Bob knows Carol, Carol knows Alice. On the right the identical facts as a graph — three nodes joined by three :knows arrows in a cycle. The table stores rows, so following a chain means a join per hop; the graph stores each relationship itself, so the same question is a traversal.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --data:#2fc47e; --data-ink:#5fe0a8;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .onchip{fill:var(--on-chip);font-size:13px;font-weight:700}
    .cell{fill:var(--panel);stroke:var(--line)}
    .flow{stroke:var(--muted);stroke-width:1.8;fill:none}
    /* colour utilities must beat the base text{fill} rule, so they come last */
    .onink{fill:var(--surface)}
    .dataink{fill:var(--data-ink)}
  </style>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="378" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">The same facts, as rows and as a graph</text>
  <text class="deck" x="26" y="62">three rows on the left, the identical three facts on the right</text>

  <!-- ============ table ============ -->
  <text class="mono sect" x="26" y="104">table · friendship</text>

  <rect x="26"  y="114" width="98" height="32" fill="var(--ink)"/>
  <rect x="124" y="114" width="98" height="32" fill="var(--ink)"/>
  <text class="body onink" x="75"  y="135" text-anchor="middle" font-weight="700">person</text>
  <text class="body onink" x="173" y="135" text-anchor="middle" font-weight="700">knows</text>

  <g class="body">
    <rect class="cell" x="26"  y="146" width="98" height="32"/>
    <rect class="cell" x="124" y="146" width="98" height="32"/>
    <text x="75"  y="167" text-anchor="middle">Alice</text>
    <text x="173" y="167" text-anchor="middle">Bob</text>

    <rect class="cell" x="26"  y="178" width="98" height="32"/>
    <rect class="cell" x="124" y="178" width="98" height="32"/>
    <text x="75"  y="199" text-anchor="middle">Bob</text>
    <text x="173" y="199" text-anchor="middle">Carol</text>

    <rect class="cell" x="26"  y="210" width="98" height="32"/>
    <rect class="cell" x="124" y="210" width="98" height="32"/>
    <text x="75"  y="231" text-anchor="middle">Carol</text>
    <text x="173" y="231" text-anchor="middle">Alice</text>
  </g>

  <!-- ============ same facts ============ -->
  <text class="ann" x="262" y="172" text-anchor="middle">same facts</text>
  <path class="flow" d="M232,190 L292,190" marker-end="url(#a)"/>

  <!-- ============ graph ============ -->
  <text class="mono sect" x="418" y="104" text-anchor="middle">graph · relationships</text>

  <g class="flow">
    <path d="M452,164 L478,210" marker-end="url(#a)"/>
    <path d="M444,232 L394,232" marker-end="url(#a)"/>
    <path d="M362,212 L388,166" marker-end="url(#a)"/>
  </g>

  <rect x="376" y="130" width="84" height="32" rx="16" fill="var(--data)"/>
  <text class="mono onchip" x="418" y="151" text-anchor="middle">:Alice</text>

  <rect x="304" y="216" width="84" height="32" rx="16" fill="var(--data)"/>
  <text class="mono onchip" x="346" y="237" text-anchor="middle">:Carol</text>

  <rect x="448" y="216" width="84" height="32" rx="16" fill="var(--data)"/>
  <text class="mono onchip" x="490" y="237" text-anchor="middle">:Bob</text>

  <text class="mono ann dataink" x="419" y="224" text-anchor="middle" font-weight="700">:knows</text>
  <text class="ann" x="418" y="274" text-anchor="middle">every arrow here is :knows</text>

  <!-- takeaway -->
  <rect x="26" y="292" width="508" height="58" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="body" x="40" y="316">A table stores rows; a graph stores the relationship itself.</text>
  <text class="body" x="40" y="336">So "who is reachable from Alice" is a traversal, not a join per hop.</text>
</svg>
