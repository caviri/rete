<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 644" role="img" aria-labelledby="t">
  <title id="t">How lazy opening works. Any client — a browser, a notebook, the CLI, a server — sends HTTP byte-range reads to one .rete file that stays where it is, on a bucket or on local disk. Only the 1 KiB header, the few dictionary chunks and the few index tiles a query actually touches are fetched; the rest of the file is never transferred, and a block cache of at most 256 MiB keeps hot blocks resident. Measured on the 52 GB datacite.rete, 9.83 billion triples: a COUNT returns 779,399 rows in 4 seconds inside a 2 GiB container, because aggregation streams and nothing is ever read whole.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .onink{fill:var(--surface);font-size:13px}
    .dimink{fill:var(--surface);font-size:13px;opacity:.72}
    .cold{fill:var(--cold);stroke:var(--line)}
    .wire{stroke:var(--data);stroke-width:1.8;fill:none}
    .wtx{font-size:13px;font-weight:700;fill:var(--data-ink)}
  </style>

  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--data)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="642" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Open lazily — fetch only the bytes you touch</text>
  <text class="deck" x="26" y="62">the file stays on the bucket or the disk; the query reaches into it</text>

  <rect x="26" y="76" width="124" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="40" y="95" font-weight="700">datacite.rete</text>
  <text class="ann" x="162" y="95">52 GB · 9.83 B triples · the largest .rete built</text>

  <!-- ================= the client ================= -->
  <text class="sect" x="26" y="136">any client — browser · notebook · CLI · server</text>

  <rect x="26" y="146" width="508" height="100" rx="7" fill="var(--ink)"/>
  <text class="mono onink" x="44" y="174">SELECT (COUNT(*) AS ?n)</text>
  <text class="mono onink" x="44" y="196">WHERE { ?s a dcite:Software }</text>
  <text class="mono dimink" x="516" y="174" text-anchor="end">2 GiB container</text>
  <text class="dimink" x="44" y="228">block cache ≤ 256 MiB · memory is O(groups), never O(file)</text>

  <!-- ================= the wire ================= -->
  <path class="wire" d="M60,260 V292" marker-end="url(#d)"/>
  <text class="mono wtx" x="76" y="282">read · Range: bytes=…</text>
  <path class="wire" d="M500,294 V262" marker-end="url(#d)"/>
  <text class="mono wtx" x="484" y="282" text-anchor="end">206 · exactly those bytes</text>

  <!-- ================= the file ================= -->
  <text class="sect" x="26" y="324">one .rete file — on a bucket or on local disk</text>
  <text class="ann" x="340" y="324">same range reader for both</text>

  <rect x="26" y="334" width="508" height="196" rx="7" fill="var(--panel)" stroke="var(--line)"/>

  <text class="body" x="42" y="358" font-weight="700">header + section directory</text>
  <rect x="42" y="366" width="16" height="14" rx="4" fill="var(--meta)"/>
  <text class="ann" x="68" y="378">1 KiB — one read locates every section</text>

  <text class="body" x="42" y="404" font-weight="700">dictionary chunks</text>
  <text class="ann" x="168" y="404">term → ID: one chunk per lookup</text>
  <g class="cold">
    <rect x="42" y="412" width="16" height="14" rx="4"/><rect x="64" y="412" width="16" height="14" rx="4"/>
    <rect x="86" y="412" width="16" height="14" rx="4"/><rect x="108" y="412" width="16" height="14" rx="4"/>
    <rect x="130" y="412" width="16" height="14" rx="4"/><rect x="152" y="412" width="16" height="14" rx="4"/>
    <rect x="174" y="412" width="16" height="14" rx="4"/><rect x="196" y="412" width="16" height="14" rx="4"/>
    <rect x="218" y="412" width="16" height="14" rx="4"/><rect x="240" y="412" width="16" height="14" rx="4"/>
    <rect x="262" y="412" width="16" height="14" rx="4"/><rect x="284" y="412" width="16" height="14" rx="4"/>
    <rect x="306" y="412" width="16" height="14" rx="4"/><rect x="328" y="412" width="16" height="14" rx="4"/>
    <rect x="350" y="412" width="16" height="14" rx="4"/><rect x="372" y="412" width="16" height="14" rx="4"/>
    <rect x="394" y="412" width="16" height="14" rx="4"/><rect x="416" y="412" width="16" height="14" rx="4"/>
    <rect x="438" y="412" width="16" height="14" rx="4"/><rect x="460" y="412" width="16" height="14" rx="4"/>
    <rect x="482" y="412" width="16" height="14" rx="4"/>
  </g>
  <g fill="var(--data)">
    <rect x="130" y="412" width="16" height="14" rx="4"/>
    <rect x="328" y="412" width="16" height="14" rx="4"/>
  </g>

  <text class="body" x="42" y="450" font-weight="700">index tiles — six permutations</text>
  <text class="ann" x="250" y="450">~64 KiB each, with a synopsis</text>
  <g class="cold">
    <rect x="42" y="458" width="16" height="14" rx="4"/><rect x="64" y="458" width="16" height="14" rx="4"/>
    <rect x="86" y="458" width="16" height="14" rx="4"/><rect x="108" y="458" width="16" height="14" rx="4"/>
    <rect x="130" y="458" width="16" height="14" rx="4"/><rect x="152" y="458" width="16" height="14" rx="4"/>
    <rect x="174" y="458" width="16" height="14" rx="4"/><rect x="196" y="458" width="16" height="14" rx="4"/>
    <rect x="218" y="458" width="16" height="14" rx="4"/><rect x="240" y="458" width="16" height="14" rx="4"/>
    <rect x="262" y="458" width="16" height="14" rx="4"/><rect x="284" y="458" width="16" height="14" rx="4"/>
    <rect x="306" y="458" width="16" height="14" rx="4"/><rect x="328" y="458" width="16" height="14" rx="4"/>
    <rect x="350" y="458" width="16" height="14" rx="4"/><rect x="372" y="458" width="16" height="14" rx="4"/>
    <rect x="394" y="458" width="16" height="14" rx="4"/><rect x="416" y="458" width="16" height="14" rx="4"/>
    <rect x="438" y="458" width="16" height="14" rx="4"/><rect x="460" y="458" width="16" height="14" rx="4"/>
    <rect x="482" y="458" width="16" height="14" rx="4"/>
    <rect x="42" y="478" width="16" height="14" rx="4"/><rect x="64" y="478" width="16" height="14" rx="4"/>
    <rect x="86" y="478" width="16" height="14" rx="4"/><rect x="108" y="478" width="16" height="14" rx="4"/>
    <rect x="130" y="478" width="16" height="14" rx="4"/><rect x="152" y="478" width="16" height="14" rx="4"/>
    <rect x="174" y="478" width="16" height="14" rx="4"/><rect x="196" y="478" width="16" height="14" rx="4"/>
    <rect x="218" y="478" width="16" height="14" rx="4"/><rect x="240" y="478" width="16" height="14" rx="4"/>
    <rect x="262" y="478" width="16" height="14" rx="4"/><rect x="284" y="478" width="16" height="14" rx="4"/>
    <rect x="306" y="478" width="16" height="14" rx="4"/><rect x="328" y="478" width="16" height="14" rx="4"/>
    <rect x="350" y="478" width="16" height="14" rx="4"/><rect x="372" y="478" width="16" height="14" rx="4"/>
    <rect x="394" y="478" width="16" height="14" rx="4"/><rect x="416" y="478" width="16" height="14" rx="4"/>
    <rect x="438" y="478" width="16" height="14" rx="4"/><rect x="460" y="478" width="16" height="14" rx="4"/>
    <rect x="482" y="478" width="16" height="14" rx="4"/>
    <rect x="42" y="498" width="16" height="14" rx="4"/><rect x="64" y="498" width="16" height="14" rx="4"/>
    <rect x="86" y="498" width="16" height="14" rx="4"/><rect x="108" y="498" width="16" height="14" rx="4"/>
    <rect x="130" y="498" width="16" height="14" rx="4"/><rect x="152" y="498" width="16" height="14" rx="4"/>
    <rect x="174" y="498" width="16" height="14" rx="4"/><rect x="196" y="498" width="16" height="14" rx="4"/>
    <rect x="218" y="498" width="16" height="14" rx="4"/><rect x="240" y="498" width="16" height="14" rx="4"/>
    <rect x="262" y="498" width="16" height="14" rx="4"/><rect x="284" y="498" width="16" height="14" rx="4"/>
    <rect x="306" y="498" width="16" height="14" rx="4"/><rect x="328" y="498" width="16" height="14" rx="4"/>
    <rect x="350" y="498" width="16" height="14" rx="4"/><rect x="372" y="498" width="16" height="14" rx="4"/>
    <rect x="394" y="498" width="16" height="14" rx="4"/><rect x="416" y="498" width="16" height="14" rx="4"/>
    <rect x="438" y="498" width="16" height="14" rx="4"/><rect x="460" y="498" width="16" height="14" rx="4"/>
    <rect x="482" y="498" width="16" height="14" rx="4"/>
  </g>
  <g fill="var(--data)">
    <rect x="196" y="458" width="16" height="14" rx="4"/>
    <rect x="218" y="458" width="16" height="14" rx="4"/>
    <rect x="394" y="478" width="16" height="14" rx="4"/>
  </g>

  <text class="ann" x="26" y="550">solid = fetched · outlined = never transferred — most of the file never moves</text>

  <!-- ================= takeaway ================= -->
  <rect x="26" y="564" width="508" height="56" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="body" x="40" y="588">A COUNT over all 9.83 billion triples returns <tspan font-weight="700">779,399 in 4 s,</tspan></text>
  <text class="body" x="40" y="608">inside a 2 GiB container. Aggregation streams — nothing is read whole.</text>
</svg>
