<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" role="img" aria-labelledby="t">
  <title id="t">A basic graph pattern is a join on a shared variable. The pattern ?p :knows ?f and the pattern ?f :age ?age both mention ?f, so the engine joins them on it: it walks each pattern through a permutation index and intersects the two streams on ?f. The result is a binding table with one column per variable — ?p, ?f and ?age — here :ann :bob 31 and :ann :cleo 27.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .pat{font-size:17px}
    .join{fill:var(--data-ink);font-weight:700}
    .onink{fill:var(--surface);font-size:13px;font-weight:700}
    .box{fill:var(--panel);stroke:var(--data)}
    .row{fill:var(--panel);stroke:var(--line)}
  </style>

  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--data)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="510" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">A basic graph pattern is a join</text>
  <text class="deck" x="26" y="62">two patterns that share a variable are joined on it</text>

  <text class="sect" x="26" y="100">the pattern</text>

  <!-- triple pattern 1 -->
  <rect class="box" x="26" y="112" width="300" height="48" rx="7"/>
  <text class="mono pat" x="46" y="142">?p</text>
  <text class="mono pat" x="96" y="142" fill="var(--ink2)">:knows</text>
  <text class="mono pat join" x="210" y="142">?f</text>
  <rect x="208" y="148" width="24" height="3" rx="1.5" fill="var(--data)"/>

  <!-- the join: from ?f in the first pattern to ?f in the second -->
  <path d="M220,161 C220,184 56,172 56,194" stroke="var(--data)" stroke-width="1.8" fill="none" marker-end="url(#d)"/>
  <text class="body u-dataink" x="244" y="184" font-weight="700">join on ?f<tspan class="ann" font-weight="400"> · the shared variable</tspan></text>

  <!-- triple pattern 2 -->
  <rect class="box" x="26" y="200" width="300" height="48" rx="7"/>
  <text class="mono pat join" x="46" y="230">?f</text>
  <rect x="44" y="236" width="24" height="3" rx="1.5" fill="var(--data)"/>
  <text class="mono pat" x="96" y="230" fill="var(--ink2)">:age</text>
  <text class="mono pat" x="210" y="230">?age</text>

  <!-- ============ bindings ============ -->
  <text class="sect" x="26" y="274">the bindings it produces</text>

  <rect x="26" y="286" width="508" height="32" rx="7" fill="var(--ink)"/>
  <text class="mono onink" x="113" y="307" text-anchor="middle">?p</text>
  <text class="mono onink" x="280" y="307" text-anchor="middle">?f</text>
  <text class="mono onink" x="447" y="307" text-anchor="middle">?age</text>

  <rect class="row" x="26" y="322" width="508" height="32" rx="7"/>
  <rect x="200" y="322" width="160" height="32" rx="7" fill="var(--data)" opacity=".12"/>
  <text class="mono body" x="113" y="343" text-anchor="middle">:ann</text>
  <text class="mono body join" x="280" y="343" text-anchor="middle">:bob</text>
  <text class="mono body" x="447" y="343" text-anchor="middle">31</text>

  <rect class="row" x="26" y="358" width="508" height="32" rx="7"/>
  <rect x="200" y="358" width="160" height="32" rx="7" fill="var(--data)" opacity=".12"/>
  <text class="mono body" x="113" y="379" text-anchor="middle">:ann</text>
  <text class="mono body join" x="280" y="379" text-anchor="middle">:cleo</text>
  <text class="mono body" x="447" y="379" text-anchor="middle">27</text>

  <text class="body" x="26" y="414">The engine walks both patterns through the permutation indexes and</text>
  <text class="body" x="26" y="434">intersects them on ?f. That intersection is the join.</text>

  <rect x="26" y="452" width="508" height="34" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body u-dataink" x="40" y="474" font-weight="700">a shared variable</text>
  <text class="body" x="172" y="474">is a join key — that is the whole of a BGP.</text>
</svg>
