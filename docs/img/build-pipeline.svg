<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 612" role="img" aria-labelledby="t">
  <title id="t">Building a .rete file: source triples in N-Triples, Turtle, N-Quads, RDF/XML or OWL are compiled by rete build — which sorts, dedupes, front-codes the dictionary and writes the permutation indexes — into one immutable file holding a dictionary, permutation indexes and a dataset card, plus an optional community pyramid that many published files do not have. The result goes on any HTTP host that answers Range requests: a bucket, a static site, a CDN. There is no server and no database to run.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .onchip{fill:var(--on-chip);font-size:13px;font-weight:700}
    .onink{fill:var(--surface);font-size:13px}
    .dimink{fill:var(--surface);font-size:13px;opacity:.72}
    .cold{fill:var(--cold);stroke:var(--line)}
    .coldtx{fill:var(--coldfg);font-size:13px;font-weight:700}
    .src{fill:var(--panel);stroke:var(--data)}
    .flow{stroke:var(--muted);stroke-width:1.8;fill:none}
  </style>

  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="610" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Building a .rete file</text>
  <text class="deck" x="26" y="62">source triples in — one immutable file out</text>

  <!-- ============ 1. sources ============ -->
  <text class="sect" x="26" y="100">source triples</text>
  <rect class="src" x="26"  y="112" width="60"  height="32" rx="16"/>
  <text class="mono body" x="56"  y="133" text-anchor="middle">.nt</text>
  <rect class="src" x="96"  y="112" width="60"  height="32" rx="16"/>
  <text class="mono body" x="126" y="133" text-anchor="middle">.ttl</text>
  <rect class="src" x="166" y="112" width="60"  height="32" rx="16"/>
  <text class="mono body" x="196" y="133" text-anchor="middle">.nq</text>
  <rect class="src" x="236" y="112" width="100" height="32" rx="16"/>
  <text class="mono body" x="286" y="133" text-anchor="middle">.rdf · .owl</text>
  <text class="ann" x="348" y="133">gzip ok · streamed</text>

  <path class="flow" d="M100,152 V174" marker-end="url(#m)"/>

  <!-- ============ 2. rete build ============ -->
  <rect x="26" y="180" width="508" height="64" rx="7" fill="var(--ink)"/>
  <text class="mono onink" x="44" y="210" font-size="15" font-weight="700">rete build</text>
  <text class="mono dimink" x="516" y="210" text-anchor="end">memory-bounded</text>
  <text class="dimink" x="44" y="232">sort · dedupe · front-code · build the permutation indexes</text>

  <path class="flow" d="M100,252 V274" marker-end="url(#m)"/>

  <!-- ============ 3. one file ============ -->
  <rect x="26" y="280" width="508" height="164" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="42" y="304" font-weight="700">social.rete</text>
  <text class="ann" x="133" y="304">one immutable file</text>

  <rect x="42" y="316" width="200" height="24" rx="4" fill="var(--data)"/>
  <text class="mono onchip" x="142" y="333" text-anchor="middle">dictionary</text>
  <text class="ann" x="254" y="333">terms ↔ IDs, both ways</text>

  <rect x="42" y="346" width="200" height="24" rx="4" fill="var(--data)"/>
  <text class="mono onchip" x="142" y="363" text-anchor="middle">permutation indexes</text>
  <text class="ann" x="254" y="363">six by default, three optional</text>

  <rect x="42" y="376" width="200" height="24" rx="4" fill="var(--meta)"/>
  <text class="mono onchip" x="142" y="393" text-anchor="middle">dataset card</text>
  <text class="ann" x="254" y="393">counts, classes, starter queries</text>

  <rect x="42" y="406" width="200" height="24" rx="4" class="cold" stroke-dasharray="5 4"/>
  <text class="mono coldtx" x="142" y="423" text-anchor="middle">pyramid</text>
  <text class="ann" x="254" y="423">optional — many files have none</text>

  <path class="flow" d="M100,452 V474" marker-end="url(#m)"/>

  <!-- ============ 4. any host ============ -->
  <rect x="26" y="480" width="508" height="58" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text class="body" x="42" y="506" font-weight="700">any HTTP host</text>
  <text class="mono ann" x="516" y="506" text-anchor="end">no server, no database</text>
  <text class="ann" x="42" y="526">a bucket, a static site, a CDN — anything that answers Range requests</text>

  <rect x="26" y="552" width="508" height="34" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body u-dataink" x="40" y="574" font-weight="700">the file is the database</text>
  <text class="body" x="223" y="574">— there is nothing to run.</text>
</svg>
