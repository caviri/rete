<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">federated query over several .rete files: a query goes to a predicate-routing router, which fans patterns out to three .rete files, whose results are union-merged by term into rows</title>
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">Federated query over several .rete files</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
  </defs>

  <!-- Query box -->
  <rect x="40" y="70" width="220" height="64" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="58" y="98" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12.5" font-weight="700" fill="#1b3a8a">SELECT ...</text>
  <text x="58" y="118" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12.5" font-weight="700" fill="#3a5a9a">WHERE { ... }</text>

  <!-- Router box -->
  <rect x="320" y="62" width="200" height="80" rx="8" fill="#0f1620"/>
  <text x="420" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">router</text>
  <text x="420" y="118" text-anchor="middle" font-size="11.5" fill="#c9d4e0">(predicate routing)</text>

  <!-- Query -> Router -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M260,102 L314,102" marker-end="url(#a)"/>
  </g>

  <!-- Three file boxes -->
  <rect x="600" y="48" width="190" height="48" rx="8" fill="#2a6df4"/>
  <text x="618" y="70" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12.5" font-weight="700" fill="#ffffff">cites-2021.rete</text>
  <text x="618" y="88" font-size="11" fill="#dce8ff">own dictionary</text>

  <rect x="600" y="106" width="190" height="48" rx="8" fill="#2a6df4"/>
  <text x="618" y="128" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12.5" font-weight="700" fill="#ffffff">cites-2023.rete</text>
  <text x="618" y="146" font-size="11" fill="#dce8ff">own dictionary</text>

  <rect x="600" y="164" width="190" height="48" rx="8" fill="#2a6df4"/>
  <text x="618" y="186" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12.5" font-weight="700" fill="#ffffff">cites-2025.rete</text>
  <text x="618" y="204" font-size="11" fill="#dce8ff">own dictionary</text>

  <!-- Router -> files (fan out) -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M520,92 C560,80 565,72 594,72" marker-end="url(#a)"/>
    <path d="M520,102 C560,110 565,128 594,130" marker-end="url(#a)"/>
    <path d="M520,112 C558,150 565,186 594,188" marker-end="url(#a)"/>
  </g>

  <!-- Union merge box -->
  <rect x="310" y="262" width="220" height="60" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="420" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1b3a8a">union merge</text>
  <text x="420" y="309" text-anchor="middle" font-size="11.5" fill="#3a5a9a">(by term)</text>

  <!-- files -> union merge (converge) -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M620,96 C600,200 540,250 500,260" marker-end="url(#a)"/>
    <path d="M640,154 C620,210 540,250 470,260" marker-end="url(#a)"/>
    <path d="M660,212 C640,250 500,256 445,260" marker-end="url(#a)"/>
  </g>

  <!-- Results box -->
  <rect x="40" y="262" width="160" height="60" rx="8" fill="#0f1620"/>
  <text x="120" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">rows</text>

  <!-- union merge -> rows -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M310,292 L206,292" marker-end="url(#a)"/>
  </g>

  <text x="410" y="356" text-anchor="middle" font-size="12.5" fill="#5b6570">Each file keeps its own dictionary; the router sends each pattern only to files that hold its</text>
  <text x="410" y="376" text-anchor="middle" font-size="12.5" fill="#5b6570">predicate, then results are merged at the term level.</text>
</svg>
