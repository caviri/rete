<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 532" role="img" aria-labelledby="t">
  <title id="t">How rete federate answers one SPARQL query from several .rete files. The router first reads each file's predicate set from its summary — a few hundred bytes, never the triple index — and skips any file whose predicates cannot match the query. The surviving files each run the query with the ordinary single-file engine and return term-level rows. Those rows are then unioned and deduplicated. The merge has to happen on strings because every file has its own dictionary, so the integer ID 42 in one file has nothing to do with ID 42 in another.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --data:#2fc47e; --data-ink:#5fe0a8;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .onchip{fill:var(--on-chip);font-size:13px}
    .box{fill:var(--panel);stroke:var(--line)}
    .flow{stroke:var(--muted);stroke-width:1.8;fill:none}
    /* colour utilities must beat the base text{fill} rule, so they come last */
    .onink{fill:var(--surface)}
    .dataink{fill:var(--data-ink)}
  </style>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="530" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Federation merges terms, not IDs</text>
  <text class="deck" x="26" y="62">every file has its own dictionary, so the integer IDs cannot be combined</text>

  <!-- ============ query ============ -->
  <text class="sect" x="26" y="104">one query</text>
  <rect class="box" x="26" y="114" width="508" height="36" rx="7"/>
  <text class="mono body" x="42" y="137">SELECT ?s ?o WHERE { ?s :cites ?o }</text>

  <path class="flow" d="M280,150 L280,166" marker-end="url(#a)"/>

  <!-- ============ router ============ -->
  <rect x="26" y="170" width="508" height="40" rx="7" fill="var(--ink)"/>
  <text class="body onink" x="280" y="195" text-anchor="middle" font-weight="700">router · predicate routing</text>

  <text class="ann" x="26" y="232">Routing reads only each file's summary — the triple index is never touched.</text>

  <path class="flow" d="M107,240 L107,256" marker-end="url(#a)"/>
  <path class="flow" d="M280,240 L280,256" marker-end="url(#a)"/>
  <path class="flow" d="M453,240 L453,256" marker-end="url(#a)"/>

  <!-- ============ three files ============ -->
  <rect x="26"  y="260" width="162" height="58" rx="7" fill="var(--data)"/>
  <text class="mono onchip" x="107" y="284" text-anchor="middle" font-weight="700">cites-2021.rete</text>
  <text class="onchip" x="107" y="304" text-anchor="middle">own dictionary</text>

  <rect x="199" y="260" width="162" height="58" rx="7" fill="var(--data)"/>
  <text class="mono onchip" x="280" y="284" text-anchor="middle" font-weight="700">cites-2023.rete</text>
  <text class="onchip" x="280" y="304" text-anchor="middle">own dictionary</text>

  <rect x="372" y="260" width="162" height="58" rx="7" fill="var(--data)"/>
  <text class="mono onchip" x="453" y="284" text-anchor="middle" font-weight="700">cites-2025.rete</text>
  <text class="onchip" x="453" y="304" text-anchor="middle">own dictionary</text>

  <text class="ann" x="280" y="340" text-anchor="middle">each survivor runs the query with the ordinary single-file engine</text>

  <path class="flow" d="M107,348 L107,364" marker-end="url(#a)"/>
  <path class="flow" d="M280,348 L280,364" marker-end="url(#a)"/>
  <path class="flow" d="M453,348 L453,364" marker-end="url(#a)"/>

  <!-- ============ union merge ============ -->
  <rect class="box" x="26" y="368" width="508" height="46" rx="7"/>
  <text class="body" x="280" y="391" text-anchor="middle" font-weight="700">union merge</text>
  <text class="ann"  x="280" y="409" text-anchor="middle">on the term strings, then deduped</text>

  <path class="flow" d="M280,414 L280,430" marker-end="url(#a)"/>

  <rect x="210" y="434" width="140" height="34" rx="7" fill="var(--ink)"/>
  <text class="body onink" x="280" y="456" text-anchor="middle" font-weight="700">rows</text>

  <!-- takeaway -->
  <rect x="26" y="482" width="508" height="38" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body dataink" x="40" y="506" font-weight="700">ID 42</text>
  <text class="body" x="90" y="506">means nothing across files — so the merge happens on strings</text>
</svg>
