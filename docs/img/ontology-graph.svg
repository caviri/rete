<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 552" role="img" aria-labelledby="t">
  <title id="t">The shipped class hierarchy is a directed acyclic graph, not a tree. Astronaut has two subClassOf parents — Scientist and Explorer — and both are kept; a single canonical parent only decides its depth. Classes are also joined by lateral, non-is-a relations: Person memberOf Organisation, drawn as a dashed edge to keep it distinguishable without relying on colour. Those lateral relations are rolled up per level too, so at level 1 the pyramid records Person memberOf Organisation and at level 0 the same edge generalises to Agent memberOf Agent — never dropped.</title>
  <!-- shared kit for the five semantic-zoom figures: class box = .cls + .clstx, instance = .inst r5.5,
       title y40 / deck y62 / chip y76 / first section label y140, 26px margins. Keep them identical. -->
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .cls{fill:var(--panel);stroke:var(--meta)}
    .clstx{fill:var(--meta-ink);font-size:13px;font-weight:700}
  </style>

  <defs>
    <marker id="isa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--meta)"/>
    </marker>
    <marker id="lat" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--data)"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="550" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">The ontology is a graph, not a tree</text>
  <text class="deck" x="26" y="62">a class can have several parents, and classes relate laterally</text>

  <!-- specimen chip -->
  <rect x="26" y="76" width="288" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="40" y="95" font-weight="700">Astronaut subClassOf Scientist, Explorer</text>
  <text class="ann" x="326" y="95">two parents</text>

  <!-- ============ the DAG ============ -->
  <text class="sect" x="26" y="140">the is-a hierarchy — every arrow points at a parent</text>

  <!-- subClassOf edges: solid -->
  <g stroke="var(--meta)" stroke-width="1.8" fill="none" marker-end="url(#isa)">
    <path d="M190,214 L268,193"/>
    <path d="M402,214 L324,193"/>
    <path d="M148,268 L175,248"/>
    <path d="M282,268 L208,248"/>
    <path d="M185,322 L152,302"/>
    <path d="M225,322 L270,302"/>
  </g>

  <!-- lateral relation: dashed, and a different family -->
  <g stroke="var(--data)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#lat)">
    <path d="M240,232 L332,232"/>
  </g>
  <text class="mono body u-dataink" x="286" y="222" text-anchor="middle" font-weight="700">memberOf</text>

  <!-- depth ruler -->
  <g class="ann">
    <text x="26" y="180">depth 0</text>
    <text x="26" y="234">depth 1</text>
    <text x="26" y="288">depth 2</text>
    <text x="26" y="342">depth 3</text>
  </g>

  <!-- class boxes -->
  <rect class="cls" x="240" y="160" width="106" height="30" rx="7"/>
  <text class="clstx" x="293" y="180" text-anchor="middle">Agent</text>

  <rect class="cls" x="140" y="214" width="100" height="30" rx="7"/>
  <text class="clstx" x="190" y="234" text-anchor="middle">Person</text>
  <rect class="cls" x="340" y="214" width="124" height="30" rx="7"/>
  <text class="clstx" x="402" y="234" text-anchor="middle">Organisation</text>

  <rect class="cls" x="96" y="268" width="104" height="30" rx="7"/>
  <text class="clstx" x="148" y="288" text-anchor="middle">Scientist</text>
  <rect class="cls" x="232" y="268" width="100" height="30" rx="7"/>
  <text class="clstx" x="282" y="288" text-anchor="middle">Explorer</text>

  <rect class="cls" x="150" y="322" width="110" height="30" rx="7"/>
  <text class="clstx" x="205" y="342" text-anchor="middle">Astronaut</text>
  <text class="ann" x="276" y="342">two parents — both kept</text>

  <!-- ============ legend: dash is the cue, not hue ============ -->
  <line x1="26" y1="392" x2="62" y2="392" stroke="var(--meta)" stroke-width="2" marker-end="url(#isa)"/>
  <text class="body" x="78" y="396">subClassOf — several parents allowed</text>
  <line x1="26" y1="418" x2="62" y2="418" stroke="var(--data)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#lat)"/>
  <text class="body" x="78" y="422">lateral relation — rolled up per level</text>

  <!-- ============ what zooming out does to a relation ============ -->
  <text class="sect" x="26" y="458">zoom out and the relation generalises with the types</text>

  <rect x="26" y="470" width="508" height="56" rx="12" fill="var(--panel)" stroke="var(--meta)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body" x="40" y="492">level 1: Person memberOf Organisation</text>
  <text class="mono body u-metaink" x="40" y="514" font-weight="700">level 0: Agent memberOf Agent</text>
  <text class="ann" x="248" y="514">generalised, never dropped</text>
</svg>
