<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">The embedded ontology is a non-exclusive graph, not a tree: a class may have several subClassOf parents (Astronaut is both a Scientist and an Explorer), and classes also carry lateral, non-is-a relations (Person memberOf Organisation).</title>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">A graph, not a tree — multiple parents + lateral links</text>

  <defs>
    <marker id="isa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
    <marker id="rel" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- subClassOf (is-a) edges: solid blue, arrow toward the parent (left) -->
  <g stroke="#2a6df4" stroke-width="1.7" fill="none" marker-end="url(#isa)">
    <path d="M242,140 L150,180"/>   <!-- Person -> Agent -->
    <path d="M242,250 L150,200"/>   <!-- Organisation -> Agent -->
    <path d="M422,100 L322,135"/>   <!-- Scientist -> Person -->
    <path d="M422,178 L322,150"/>   <!-- Explorer -> Person -->
    <path d="M602,135 L495,108"/>   <!-- Astronaut -> Scientist -->
    <path d="M602,150 L495,185"/>   <!-- Astronaut -> Explorer  (the SECOND parent) -->
  </g>

  <!-- lateral (non-is-a) relation: dashed green -->
  <g stroke="#16a34a" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#rel)">
    <path d="M270,160 C300,210 300,210 268,238"/>  <!-- Person -memberOf-> Organisation -->
  </g>
  <text x="318" y="208" font-size="10" font-weight="600" fill="#16a34a">memberOf</text>

  <!-- class nodes -->
  <g font-size="12.5" font-weight="700">
    <rect x="58" y="170" width="90" height="36" rx="7" fill="#2a6df4"/>
    <text x="103" y="193" text-anchor="middle" fill="#ffffff">Agent</text>

    <rect x="248" y="122" width="74" height="34" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="285" y="144" text-anchor="middle" fill="#0f2347">Person</text>
    <rect x="248" y="232" width="108" height="34" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="302" y="254" text-anchor="middle" fill="#0f2347">Organisation</text>

    <rect x="426" y="84" width="84" height="34" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="468" y="106" text-anchor="middle" fill="#0f2347">Scientist</text>
    <rect x="426" y="162" width="84" height="34" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="468" y="184" text-anchor="middle" fill="#0f2347">Explorer</text>

    <rect x="600" y="124" width="96" height="36" rx="7" fill="#f5f7f9" stroke="#cdd7e2"/>
    <text x="648" y="147" text-anchor="middle" fill="#1b1f24">Astronaut</text>
  </g>
  <text x="648" y="178" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="700">two parents</text>

  <!-- legend -->
  <g font-size="11.5">
    <line x1="70" y1="320" x2="110" y2="320" stroke="#2a6df4" stroke-width="2" marker-end="url(#isa)"/>
    <text x="118" y="324" fill="#1b1f24">subClassOf — the <tspan font-style="italic">is-a</tspan> hierarchy (kept in full, multiple parents allowed)</text>
    <line x1="70" y1="346" x2="110" y2="346" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rel)"/>
    <text x="118" y="350" fill="#1b1f24">lateral relation — a <tspan font-style="italic">relates-to</tspan> connection (rolled up per level)</text>
  </g>
</svg>
