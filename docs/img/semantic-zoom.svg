<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 522" role="img" aria-labelledby="t">
  <title id="t">A four-level schema pyramid over the six-class subClassOf hierarchy in a small people graph. Level 0 is Agent times 4; level 1 is Person times 3 and Organisation times 1; level 2 is Scientist times 2, Artist times 1 and Organisation times 1; level 3, the leaves, is Astronomer times 2, Artist times 1 and Organisation times 1. Every level re-partitions the same four instances, so the counts conserve, and rete summary --level k reads any one level without touching the triple index. The pyramid is section kind 4 and is optional: a graph with no rdf:type has none.</title>
  <!-- shared kit for the five semantic-zoom figures: class box = .cls + .clstx, instance = .inst r5.5,
       title y40 / deck y62 / chip y76 / first section label y140, 26px margins. Keep them identical. -->
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --cold:#eef1f6; --coldfg:#616b77; --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
      --meta:#a259f7; --meta-ink:#7a2fe0;
      --warn:#b32741;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --cold:#232b35; --coldfg:#8d99a6;
        --data:#2fc47e; --data-ink:#5fe0a8;
        --meta:#a978f7; --meta-ink:#c6a4ff;
        --warn:#ff8098;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .cls{fill:var(--panel);stroke:var(--meta)}
    .clstx{fill:var(--meta-ink);font-size:13px;font-weight:700}
    .inst{fill:var(--data)}
  </style>

  <rect x="1" y="1" width="558" height="520" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">Semantic zoom — one histogram per level</text>
  <text class="deck" x="26" y="62">coarse at the top — the same instances, re-partitioned at each subClassOf depth</text>

  <!-- specimen chip -->
  <rect x="26" y="76" width="88" height="28" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text class="mono body" x="40" y="95" font-weight="700">people.nt</text>
  <text class="ann" x="126" y="95">6 classes · 4 instances · 4 levels</text>

  <!-- ============ the four level bands ============ -->
  <text class="sect" x="26" y="140">one band = one level = one type histogram</text>

  <!-- level 0 -->
  <rect class="cls" x="185" y="152" width="190" height="52" rx="7"/>
  <text class="clstx" x="280" y="173" text-anchor="middle">level 0 · abstract</text>
  <text class="body" x="280" y="193" text-anchor="middle" font-weight="700">Agent ×4</text>

  <!-- level 1 -->
  <rect class="cls" x="132" y="214" width="296" height="52" rx="7"/>
  <text class="clstx" x="280" y="235" text-anchor="middle">level 1</text>
  <text class="body" x="280" y="255" text-anchor="middle" font-weight="700">Person ×3 · Organisation ×1</text>

  <!-- level 2 -->
  <rect class="cls" x="79" y="276" width="402" height="52" rx="7"/>
  <text class="clstx" x="280" y="297" text-anchor="middle">level 2</text>
  <text class="body" x="280" y="317" text-anchor="middle" font-weight="700">Scientist ×2 · Artist ×1 · Organisation ×1</text>

  <!-- level 3 -->
  <rect class="cls" x="26" y="338" width="508" height="52" rx="7"/>
  <text class="clstx" x="280" y="359" text-anchor="middle">level 3 · leaves</text>
  <text class="body" x="280" y="379" text-anchor="middle" font-weight="700">Astronomer ×2 · Artist ×1 · Organisation ×1</text>

  <!-- ============ the instances, once ============ -->
  <g class="inst">
    <circle cx="32" cy="414" r="5.5"/><circle cx="50" cy="414" r="5.5"/>
    <circle cx="68" cy="414" r="5.5"/><circle cx="86" cy="414" r="5.5"/>
  </g>
  <text class="ann" x="104" y="419">the same four instances at every level — counts conserve</text>

  <text class="ann" x="26" y="446">No rdf:type in the graph? No pyramid — section kind 4 is simply absent.</text>

  <!-- takeaway -->
  <rect x="26" y="462" width="508" height="34" rx="12" fill="var(--panel)" stroke="var(--meta)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="mono body u-metaink" x="40" y="484" font-weight="700">rete summary --level k</text>
  <text class="body" x="200" y="484">one level — the triple index is never read</text>
</svg>
