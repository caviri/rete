<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">The schema pyramid: one type histogram per semantic level — abstract classes at the coarse top, leaf classes at the detailed base. Each level re-partitions the same instances at a finer subClassOf depth, so counts conserve up the hierarchy.</title>
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">Semantic zoom — one type histogram per level</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#5b6570">the same instances, rolled up the subClassOf hierarchy to each level's depth</text>

  <!-- Level bands: increasing width downward = the pyramid silhouette -->
  <!-- Level 0 (apex, abstract) -->
  <rect x="245" y="70" width="230" height="58" rx="7" fill="#2a6df4"/>
  <text x="360" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#cfe0fb">LEVEL 0 · depth 0 · abstract</text>
  <text x="360" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Agent ×4</text>

  <!-- Level 1 -->
  <rect x="195" y="136" width="330" height="58" rx="7" fill="#7aa2f0"/>
  <text x="360" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#1b3a73">LEVEL 1 · depth 1</text>
  <text x="360" y="179" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2347">Person ×3 · Organisation ×1</text>

  <!-- Level 2 -->
  <rect x="135" y="202" width="450" height="58" rx="7" fill="#bcd0f7"/>
  <text x="360" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#1b3a73">LEVEL 2 · depth 2</text>
  <text x="360" y="245" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2347">Scientist ×2 · Artist ×1 · Organisation ×1</text>

  <!-- Level 3 (base, leaves) -->
  <rect x="75" y="268" width="570" height="58" rx="7" fill="#e6eefb"/>
  <text x="360" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1b3a73">LEVEL 3 · depth 3 · leaves</text>
  <text x="360" y="311" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f2347">Astronomer ×2 · Artist ×1 · Organisation ×1</text>

  <!-- Zoom axis on the right -->
  <defs>
    <marker id="zd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
  </defs>
  <line x1="676" y1="78" x2="676" y2="318" stroke="#5b6570" stroke-width="1.6" marker-end="url(#zd)"/>
  <text x="690" y="150" font-size="11" font-weight="600" fill="#5b6570" transform="rotate(90 690 150)">zoom in · more detail</text>
  <text x="44" y="200" font-size="11" font-weight="600" fill="#5b6570" transform="rotate(-90 44 200)">coarser · fewer bytes</text>

  <!-- Index-free footer -->
  <rect x="75" y="352" width="570" height="48" rx="7" fill="#f5f7f9" stroke="#e4e8ec"/>
  <text x="360" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b1f24">read index-free from the pyramid-meta</text>
  <text x="360" y="390" text-anchor="middle" font-size="11.5" fill="#5b6570">rete summary --level k · summary-url — a few KB over HTTP, the triple index is never fetched</text>
</svg>
