<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">How lazy querying works: the browser sends HTTP Range requests to a remote .rete file on a bucket and fetches only the dictionary chunks and index tiles a query touches; most of the file is never transferred.</title>
  <rect width="460" height="250" fill="#ffffff"/>
  <text x="230" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1f24">Lazy querying — fetch only the bytes a query touches</text>

  <defs>
    <marker id="rq" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a6df4"/></marker>
    <marker id="rs" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="24" y="92" width="150" height="86" rx="9" fill="#0f1620"/>
  <rect x="24" y="92" width="150" height="20" rx="9" fill="#2a3340"/>
  <circle cx="36" cy="102" r="3" fill="#ff5f57"/><circle cx="46" cy="102" r="3" fill="#febc2e"/><circle cx="56" cy="102" r="3" fill="#28c840"/>
  <text x="99" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Browser</text>
  <text x="99" y="158" text-anchor="middle" font-size="10.5" fill="#9fb3c8">a SPARQL query</text>

  <!-- request / response arrows -->
  <line x1="178" y1="118" x2="296" y2="92"  stroke="#2a6df4" stroke-width="1.7" marker-end="url(#rq)"/>
  <text x="232" y="98" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a6df4">Range: bytes=…</text>
  <line x1="296" y1="200" x2="178" y2="168" stroke="#16a34a" stroke-width="1.7" marker-end="url(#rs)"/>
  <text x="232" y="196" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">206 — just those tiles</text>

  <!-- Remote .rete file as a stack of tiles -->
  <text x="372" y="44" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b1f24">remote .rete on a bucket</text>
  <g>
    <!-- most tiles grey (not fetched), a few blue (fetched) -->
    <rect x="320" y="52" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
    <rect x="320" y="70" width="104" height="15" rx="3" fill="#2a6df4"/>
    <rect x="320" y="88" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
    <rect x="320" y="106" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
    <rect x="320" y="124" width="104" height="15" rx="3" fill="#2a6df4"/>
    <rect x="320" y="142" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
    <rect x="320" y="160" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
    <rect x="320" y="178" width="104" height="15" rx="3" fill="#2a6df4"/>
    <rect x="320" y="196" width="104" height="15" rx="3" fill="#eef3ff" stroke="#cdd7e2"/>
  </g>
  <text x="372" y="227" text-anchor="middle" font-size="10" fill="#5b6570">blue = fetched · grey = never transferred</text>

  <!-- caption -->
  <text x="230" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#1b1f24">a 100 MB / 1 GB graph stays interactive — only a few MB cross the wire per query</text>
</svg>
