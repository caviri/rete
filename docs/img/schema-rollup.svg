<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">How a level is built: instances live at the leaf classes; rolling each instance's type up its subClassOf chain to a chosen depth produces that level's type histogram. Counts conserve up the hierarchy.</title>
  <rect width="760" height="410" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1b1f24">The rollup: subClassOf is the zoom function</text>

  <!-- Depth ruler -->
  <g font-size="11" font-weight="700" fill="#5b6570">
    <text x="95" y="60" text-anchor="middle">depth 0</text>
    <text x="265" y="60" text-anchor="middle">depth 1</text>
    <text x="435" y="60" text-anchor="middle">depth 2</text>
    <text x="615" y="60" text-anchor="middle">depth 3 · leaves</text>
  </g>
  <line x1="40" y1="70" x2="720" y2="70" stroke="#e4e8ec" stroke-width="1"/>

  <defs>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2a6df4"/>
    </marker>
  </defs>

  <!-- subClassOf edges (child -> parent, arrow points toward the parent / left) -->
  <g stroke="#2a6df4" stroke-width="1.6" fill="none" marker-end="url(#up)">
    <path d="M250,120 L150,150"/>   <!-- Person -> Agent -->
    <path d="M250,235 L150,165"/>   <!-- Organisation -> Agent -->
    <path d="M420,100 L320,128"/>   <!-- Scientist -> Person -->
    <path d="M420,175 L320,140"/>   <!-- Artist -> Person -->
    <path d="M600,100 L490,108"/>   <!-- Astronomer -> Scientist -->
  </g>
  <text x="200" y="128" font-size="9.5" fill="#5b6570">subClassOf</text>

  <!-- Class nodes -->
  <g font-size="12.5" font-weight="700">
    <rect x="55" y="138" width="92" height="38" rx="7" fill="#2a6df4"/>
    <text x="101" y="162" text-anchor="middle" fill="#ffffff">Agent</text>

    <rect x="225" y="108" width="92" height="36" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="271" y="131" text-anchor="middle" fill="#0f2347">Person</text>
    <rect x="225" y="218" width="110" height="36" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="280" y="241" text-anchor="middle" fill="#0f2347">Organisation</text>

    <rect x="400" y="82" width="92" height="36" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="446" y="105" text-anchor="middle" fill="#0f2347">Scientist</text>
    <rect x="400" y="158" width="92" height="36" rx="7" fill="#eef3ff" stroke="#bcd0f7"/>
    <text x="446" y="181" text-anchor="middle" fill="#0f2347">Artist</text>

    <rect x="578" y="82" width="104" height="36" rx="7" fill="#f5f7f9" stroke="#e4e8ec"/>
    <text x="630" y="105" text-anchor="middle" fill="#1b1f24">Astronomer</text>
  </g>

  <!-- Instance dots at the leaves -->
  <g>
    <circle cx="598" cy="135" r="6" fill="#16a34a"/><circle cx="616" cy="135" r="6" fill="#16a34a"/>
    <text x="690" y="139" font-size="10.5" fill="#5b6570">ada, edwin · a Astronomer</text>
    <circle cx="416" cy="210" r="6" fill="#16a34a"/>
    <text x="500" y="214" font-size="10.5" fill="#5b6570">frida · a Artist</text>
    <circle cx="246" cy="270" r="6" fill="#16a34a"/>
    <text x="345" y="274" font-size="10.5" fill="#5b6570">nasa · a Organisation</text>
  </g>

  <!-- Rollup explanation panel -->
  <rect x="40" y="312" width="680" height="74" rx="8" fill="#f5f7f9" stroke="#e4e8ec"/>
  <text x="58" y="335" font-size="12.5" font-weight="700" fill="#1b1f24">Roll each instance's type up to depth d → level d's histogram</text>
  <g font-size="11.5" fill="#0f2347">
    <text x="58" y="356">depth 3: Astronomer ×2 · Artist ×1 · Organisation ×1</text>
    <text x="58" y="374">depth 1: Person ×3 · Organisation ×1</text>
    <text x="430" y="356">depth 2: Scientist ×2 · Artist ×1 · Organisation ×1</text>
    <text x="430" y="374" font-weight="700">depth 0: Agent ×4   (everything)</text>
  </g>
</svg>
