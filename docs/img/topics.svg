<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">From communities to topics: three node communities feed an LDA topic model that produces three human-readable topic cards of keywords</title>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">From communities to topics (LDA)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5b6570"/>
    </marker>
  </defs>

  <!-- Community 1 (accent blue) -->
  <circle cx="105" cy="92" r="38" fill="#ffffff" stroke="#2a6df4" stroke-width="1.5"/>
  <g fill="#2a6df4">
    <circle cx="92" cy="80" r="4"/><circle cx="116" cy="84" r="4"/><circle cx="100" cy="98" r="4"/>
    <circle cx="118" cy="102" r="4"/><circle cx="88" cy="100" r="4"/>
  </g>
  <text x="105" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2a6df4">community 1</text>

  <!-- Community 2 (navy) -->
  <circle cx="105" cy="184" r="38" fill="#ffffff" stroke="#0f1620" stroke-width="1.5"/>
  <g fill="#0f1620">
    <circle cx="92" cy="172" r="4"/><circle cx="116" cy="176" r="4"/><circle cx="100" cy="190" r="4"/>
    <circle cx="118" cy="194" r="4"/><circle cx="88" cy="192" r="4"/>
  </g>
  <text x="105" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1620">community 2</text>

  <!-- Community 3 (muted) -->
  <circle cx="105" cy="276" r="38" fill="#ffffff" stroke="#5b6570" stroke-width="1.5"/>
  <g fill="#5b6570">
    <circle cx="92" cy="264" r="4"/><circle cx="116" cy="268" r="4"/><circle cx="100" cy="282" r="4"/>
    <circle cx="118" cy="286" r="4"/><circle cx="88" cy="284" r="4"/>
  </g>
  <text x="105" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6570">community 3</text>

  <!-- LDA box (middle) -->
  <rect x="320" y="150" width="160" height="60" rx="8" fill="#0f1620"/>
  <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LDA</text>
  <text x="400" y="196" text-anchor="middle" font-size="11.5" fill="#c9d4e0">topic model</text>

  <!-- Topic cards (right) -->
  <rect x="560" y="62" width="200" height="64" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="576" y="86" font-size="12" font-weight="700" fill="#1b3a8a">topic card 1</text>
  <text x="576" y="108" font-size="11.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#3a5a9a">protein, folding, structure</text>

  <rect x="560" y="148" width="200" height="64" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="576" y="172" font-size="12" font-weight="700" fill="#1b3a8a">topic card 2</text>
  <text x="576" y="194" font-size="11.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#3a5a9a">climate, carbon, ocean</text>

  <rect x="560" y="234" width="200" height="64" rx="8" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="576" y="258" font-size="12" font-weight="700" fill="#1b3a8a">topic card 3</text>
  <text x="576" y="280" font-size="11.5" font-family="ui-monospace,SFMono-Regular,monospace" fill="#3a5a9a">neural, model, training</text>

  <!-- arrows community -> LDA -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M146,98 C240,120 270,160 314,172" marker-end="url(#a)"/>
    <path d="M146,184 C230,184 270,182 314,182" marker-end="url(#a)"/>
    <path d="M146,270 C240,248 270,208 314,192" marker-end="url(#a)"/>
  </g>

  <!-- arrows LDA -> topic cards -->
  <g stroke="#5b6570" stroke-width="1.5" fill="none">
    <path d="M480,168 C516,140 524,110 554,98" marker-end="url(#a)"/>
    <path d="M480,180 C516,180 524,180 554,180" marker-end="url(#a)"/>
    <path d="M480,192 C516,222 524,254 554,262" marker-end="url(#a)"/>
  </g>

  <text x="400" y="340" text-anchor="middle" font-size="12.5" fill="#5b6570">Each discovered community gets a human-readable theme from the words on its nodes.</text>
</svg>
