<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" role="img" aria-labelledby="t">
  <title id="t">The same six nodes A to F, partitioned twice. Grouped by the :cites relation they fall into community 0 with A, B and C and community 1 with D, E and F. Grouped by :hasTopic the same six regroup into community 0 with A, D and F and community 1 with B, C and E. Node A shares a community with B and C under one criterion and with D and F under the other, so "what community is A in" has no single answer — there is one partition per criterion.</title>
  <style>
    :root{
      --ink:#14171c; --ink2:#454c55; --muted:#5b6570;
      --surface:#f7f8fb; --panel:#ffffff; --line:#c9d2de;
      --on-chip:#0d1116;
      --data:#2bb673; --data-ink:#17794a;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --ink:#e7ecf3; --ink2:#b4bec9; --muted:#98a4b1;
        --surface:#12161c; --panel:#1b212a; --line:#39434f;
        --data:#2fc47e; --data-ink:#5fe0a8;
      }
    }
    svg{fill:var(--ink)}
    text{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
    /* Colour utilities for text. The base fill lives on svg{} so that fill=
       attributes and group-level fills still win by inheritance. */
    .u-coldfg{fill:var(--coldfg)}
    .u-data{fill:var(--data)}
    .u-dataink{fill:var(--data-ink)}
    .u-ink{fill:var(--ink)}
    .u-ink2{fill:var(--ink2)}
    .u-meta{fill:var(--meta)}
    .u-metaink{fill:var(--meta-ink)}
    .u-muted{fill:var(--muted)}
    .u-onchip{fill:var(--on-chip)}
    .u-onink{fill:var(--surface)}
    .u-warn{fill:var(--warn)}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .title{font-size:19px;font-weight:700}
    .deck{font-size:13px;fill:var(--muted)}
    .sect{font-size:13px;font-weight:700;fill:var(--ink2)}
    .body{font-size:13px}
    .ann{font-size:13px;fill:var(--muted)}
    .panel{fill:var(--panel);stroke:var(--line)}
    .hull{fill:none;stroke:var(--line);stroke-dasharray:5 4}
    .solid{fill:var(--data)}
    .hollow{fill:var(--surface);stroke:var(--data);stroke-width:1.8}
    .lblsolid{fill:var(--on-chip);font-size:13px;font-weight:700}
    .lblhollow{fill:var(--data-ink);font-size:13px;font-weight:700}
  </style>

  <rect x="1" y="1" width="558" height="362" rx="14" fill="var(--surface)" stroke="var(--line)"/>

  <text class="title" x="26" y="40">The same nodes, different communities</text>
  <text class="deck" x="26" y="62">which group a node lands in depends on the relation you partition by</text>

  <!-- ============ by :cites ============ -->
  <rect class="panel" x="26" y="88" width="244" height="176" rx="7"/>
  <text class="mono sect" x="148" y="110" text-anchor="middle">grouped by :cites</text>

  <rect class="hull" x="38" y="122" width="104" height="88" rx="12"/>
  <circle class="solid" cx="68"  cy="150" r="16"/>
  <circle class="solid" cx="112" cy="154" r="16"/>
  <circle class="solid" cx="88"  cy="188" r="16"/>
  <text class="lblsolid" x="68"  y="155" text-anchor="middle">A</text>
  <text class="lblsolid" x="112" y="159" text-anchor="middle">B</text>
  <text class="lblsolid" x="88"  y="193" text-anchor="middle">C</text>
  <text class="ann" x="90" y="228" text-anchor="middle">community 0</text>

  <rect class="hull" x="154" y="122" width="104" height="88" rx="12"/>
  <circle class="hollow" cx="184" cy="150" r="16"/>
  <circle class="hollow" cx="228" cy="154" r="16"/>
  <circle class="hollow" cx="204" cy="188" r="16"/>
  <text class="lblhollow" x="184" y="155" text-anchor="middle">D</text>
  <text class="lblhollow" x="228" y="159" text-anchor="middle">E</text>
  <text class="lblhollow" x="204" y="193" text-anchor="middle">F</text>
  <text class="ann" x="206" y="228" text-anchor="middle">community 1</text>

  <text class="mono body" x="148" y="252" text-anchor="middle">{A B C} · {D E F}</text>

  <!-- ============ by :hasTopic ============ -->
  <rect class="panel" x="290" y="88" width="244" height="176" rx="7"/>
  <text class="mono sect" x="412" y="110" text-anchor="middle">grouped by :hasTopic</text>

  <rect class="hull" x="302" y="122" width="104" height="88" rx="12"/>
  <circle class="solid" cx="332" cy="150" r="16"/>
  <circle class="solid" cx="376" cy="154" r="16"/>
  <circle class="solid" cx="352" cy="188" r="16"/>
  <text class="lblsolid" x="332" y="155" text-anchor="middle">A</text>
  <text class="lblsolid" x="376" y="159" text-anchor="middle">D</text>
  <text class="lblsolid" x="352" y="193" text-anchor="middle">F</text>
  <text class="ann" x="354" y="228" text-anchor="middle">community 0</text>

  <rect class="hull" x="418" y="122" width="104" height="88" rx="12"/>
  <circle class="hollow" cx="448" cy="150" r="16"/>
  <circle class="hollow" cx="492" cy="154" r="16"/>
  <circle class="hollow" cx="468" cy="188" r="16"/>
  <text class="lblhollow" x="448" y="155" text-anchor="middle">B</text>
  <text class="lblhollow" x="492" y="159" text-anchor="middle">C</text>
  <text class="lblhollow" x="468" y="193" text-anchor="middle">E</text>
  <text class="ann" x="470" y="228" text-anchor="middle">community 1</text>

  <text class="mono body" x="412" y="252" text-anchor="middle">{A D F} · {B C E}</text>

  <!-- takeaway -->
  <rect x="26" y="280" width="508" height="58" rx="12" fill="var(--panel)" stroke="var(--data)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="body" x="40" y="304">A sits with B and C by :cites, but with D and F by :hasTopic.</text>
  <text class="body" x="40" y="324">There is no single correct community — there is one per criterion.</text>
</svg>
