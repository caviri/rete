<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t">
  <title id="t">Multi-criteria communities: the same six nodes A through F partition into different clusters depending on whether they are grouped by the cites relation or the hasTopic relation</title>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1f24">Multi-criteria communities: one graph, different partitions</text>

  <!-- Left panel -->
  <rect x="40" y="64" width="340" height="220" rx="8" fill="#ffffff" stroke="#e4e8ec"/>
  <text x="210" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">partitioned by :cites</text>

  <!-- Left cluster 1 (accent blue) : A B C -->
  <circle cx="120" cy="150" r="22" fill="#2a6df4"/>
  <text x="120" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <circle cx="180" cy="135" r="22" fill="#2a6df4"/>
  <text x="180" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
  <circle cx="150" cy="200" r="22" fill="#2a6df4"/>
  <text x="150" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>

  <!-- Left cluster 2 (light blue) : D E F -->
  <circle cx="280" cy="140" r="22" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="280" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3a8a">D</text>
  <circle cx="320" cy="190" r="22" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="320" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3a8a">E</text>
  <circle cx="260" cy="215" r="22" fill="#dce8ff" stroke="#2a6df4"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3a8a">F</text>

  <!-- Right panel -->
  <rect x="420" y="64" width="340" height="220" rx="8" fill="#ffffff" stroke="#e4e8ec"/>
  <text x="590" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f24">partitioned by :hasTopic</text>

  <!-- Right cluster 1 (navy) : A D F -->
  <circle cx="500" cy="150" r="22" fill="#0f1620"/>
  <text x="500" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <circle cx="560" cy="135" r="22" fill="#0f1620"/>
  <text x="560" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">D</text>
  <circle cx="530" cy="200" r="22" fill="#0f1620"/>
  <text x="530" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">F</text>

  <!-- Right cluster 2 (muted grey) : B C E -->
  <circle cx="660" cy="140" r="22" fill="#5b6570"/>
  <text x="660" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
  <circle cx="700" cy="190" r="22" fill="#5b6570"/>
  <text x="700" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
  <circle cx="640" cy="215" r="22" fill="#5b6570"/>
  <text x="640" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">E</text>

  <text x="400" y="330" text-anchor="middle" font-size="12.5" fill="#5b6570">The same nodes cluster differently depending on which relation (or attribute) you partition by.</text>
</svg>
