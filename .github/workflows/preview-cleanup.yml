name: Remove closed playground PR preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: remove every object for the closed PR
    runs-on: ubuntu-latest
    environment: playground-preview
    concurrency:
      group: playground-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default-branch cleanup code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 -m pip install --disable-pip-version-check boto3
      - name: Delete the complete PR prefix
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_S3_API_ENDPOINT: ${{ secrets.PREVIEW_S3_API_ENDPOINT }}
          PREVIEW_ACCESS_KEY_ID: ${{ secrets.PREVIEW_ACCESS_KEY_ID }}
          PREVIEW_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_SECRET_ACCESS_KEY }}
          PREVIEW_BUCKET: ${{ secrets.PREVIEW_BUCKET }}
        run: python3 scripts/preview_store.py cleanup --pr "$PR_NUMBER"
