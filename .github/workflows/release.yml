name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_crates_io_auth:
        description: Exchange a trusted-publishing token without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: meta
        name: Match the tag to the workspace version
        run: |
          version=$(awk '/^\[workspace.package\]/{found=1; next} found && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          test -n "$version"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "tag $GITHUB_REF_NAME does not match $tag" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  native:
    name: ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            family: linux
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            family: linux
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            family: native
            target: x86_64-apple-darwin
          - os: macos-15
            family: native
            target: aarch64-apple-darwin
          - os: windows-2025
            family: native
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            family: native
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build and package in the pinned development image
        if: matrix.family == 'linux'
        shell: bash
        run: |
          docker build -t rete-dev-release -f .devcontainer/Dockerfile .
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work rete-dev-release \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/package_release.sh "${{ needs.meta.outputs.tag }}" "${{ matrix.target }}"'
      - name: Install the pinned native Rust toolchain
        if: matrix.family == 'native'
        shell: bash
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Build and package on the native runner
        if: matrix.family == 'native'
        shell: bash
        env:
          CARGO_TARGET_DIR: target
        run: bash scripts/package_release.sh "${{ needs.meta.outputs.tag }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: rete-${{ matrix.target }}
          path: dist/rete-${{ needs.meta.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  wasm:
    name: browser WASM bundle
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build every browser variant in the pinned image
        run: |
          docker build -t rete-dev-release -f .devcontainer/Dockerfile .
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -e RETE_SOURCE_REVISION="$GITHUB_SHA" \
            -e RETE_BUILD_STAMP="${{ needs.meta.outputs.version }}" \
            -v "$PWD:/work" -w /work rete-dev-release \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/build_wasm.sh'
      - name: Package browser artifacts
        run: |
          name="rete-wasm-${{ needs.meta.outputs.version }}"
          mkdir -p "dist/$name/web" "dist/$name/docs"
          cp -a web/pkg web/pkg-nomodules web/pkg-nomodules-async "dist/$name/web/"
          cp docs/rete_wasm.js docs/rete_wasm_bg.wasm \
            docs/rete_wasm_async.js docs/rete_wasm_async.wasm \
            docs/wasm-build.json "dist/$name/docs/"
          cp crates/rete-wasm/README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: rete-wasm
          path: dist/rete-wasm-${{ needs.meta.outputs.version }}.tar.gz
          if-no-files-found: error

  mcpb:
    name: Claude Desktop extension
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build the wasm engine in the pinned image
        run: |
          docker build -t rete-dev-release -f .devcontainer/Dockerfile .
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work rete-dev-release \
            sh -lc 'git config --global --add safe.directory /work &&
                    wasm-pack build crates/rete-wasm --target web --no-opt \
                      --out-dir /work/clients/js/vendor/pkg'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the JS client, then the bundle
        run: |
          npm --prefix clients/js install --no-audit --no-fund
          node clients/js/build.mjs
          npm --prefix clients/mcpb install --no-audit --no-fund
          node clients/mcpb/build.mjs
      - name: Verify the bundle over stdio before shipping it
        run: node --test --test-timeout=180000 clients/mcpb/test/*.test.mjs
      - name: Validate and pack
        run: |
          npx --yes @anthropic-ai/mcpb@2 validate clients/mcpb/build/manifest.json
          mkdir -p dist
          npx --yes @anthropic-ai/mcpb@2 pack clients/mcpb/build \
            "dist/rete-${{ needs.meta.outputs.version }}.mcpb"
      - uses: actions/upload-artifact@v7
        with:
          name: rete-mcpb
          path: dist/rete-${{ needs.meta.outputs.version }}.mcpb
          if-no-files-found: error

  blender:
    name: Blender add-on
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build the headless Blender image
        run: docker build -t rete-blender clients/blender
      - name: Test the add-on against a fixture graph and the published ones
        run: |
          docker run --rm -v "$PWD:/work" -w /work rete-blender \
            blender -b --factory-startup -noaudio \
              --python clients/blender/tests/run_tests.py
          docker run --rm -v "$PWD:/work" -w /work rete-blender \
            blender -b --factory-startup -noaudio \
              --python clients/blender/tests/test_remote.py
      - name: Package the extension, wheels bundled
        run: |
          docker run --rm -e RETE_ADDON_VERSION=${{ needs.meta.outputs.version }} \
            -v "$PWD:/work" -w /work rete-blender sh clients/blender/build.sh
          mkdir -p dist
          mv clients/blender/dist/rete-*.zip \
            "dist/rete-blender-${{ needs.meta.outputs.version }}.zip"
      - name: Verify the packaged extension installs with no engine present
        run: |
          docker build --build-arg WITH_ENGINE=0 -t rete-blender-clean clients/blender
          docker run --rm -v "$PWD:/work" -w /work rete-blender-clean sh -c '
            blender -b -noaudio --command extension install-file \
              -r user_default --enable dist/rete-blender-*.zip &&
            blender -b -noaudio --python clients/blender/tests/test_extension.py'
      - uses: actions/upload-artifact@v7
        with:
          name: rete-blender
          path: dist/rete-blender-${{ needs.meta.outputs.version }}.zip
          if-no-files-found: error

  assemble:
    name: checksums, SBOM, attestations, and GitHub release
    needs: [meta, native, wasm, mcpb, blender]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: rete-*
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.mcpb > SHA256SUMS
      - name: Generate the locked CycloneDX dependency graph
        run: |
          docker build -t rete-dev-release -f .devcontainer/Dockerfile .
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -v "$PWD:/work" -w /work rete-dev-release \
            cargo cyclonedx --manifest-path crates/rete-cli/Cargo.toml \
              --format json --all --target all --spec-version 1.5 \
              --override-filename rete-${{ needs.meta.outputs.version }}.cdx
          mv crates/rete-cli/rete-${{ needs.meta.outputs.version }}.cdx.json dist/
      - name: Attest every archive and checksum
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/SHA256SUMS
      - name: Bind the CycloneDX SBOM to every release archive
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/rete-${{ needs.meta.outputs.version }}.cdx.json
      - name: Preserve the complete dry-run release set
        uses: actions/upload-artifact@v7
        with:
          name: rete-release-${{ needs.meta.outputs.version }}
          path: dist/*
      - name: Publish the prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Rete ${{ needs.meta.outputs.version }}
          body_path: docs/release.md
          prerelease: ${{ contains(needs.meta.outputs.version, '-rc.') || startsWith(needs.meta.outputs.version, '0.') }}
          files: dist/*

  # crates.io Trusted Publishing can only be configured on a crate that already
  # exists, so the very first publication of each crate has to be the manual
  # `publish_crates.sh --bootstrap` run with an ephemeral token (see
  # docs/release.md). v0.3.0 is that bootstrap tag; every later tag publishes
  # here through OIDC with no stored registry secret.
  publish-crates:
    name: protected crates.io publishing
    needs: [meta, assemble]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      ((github.event_name == 'push' && github.ref_name != 'v0.3.0') ||
       (github.event_name == 'workflow_dispatch' && inputs.verify_crates_io_auth))
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Build the pinned publication environment
        run: docker build -t rete-dev-release -f .devcontainer/Dockerfile .
      - name: Exchange OIDC for a short-lived crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RETE_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -e CARGO_REGISTRY_TOKEN -e RETE_RELEASE_VERSION \
            -v "$PWD:/work" -w /work rete-dev-release \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/publish_crates.sh --trusted "$RETE_RELEASE_VERSION"'
      - name: Verify trusted-publishing authentication without publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RETE_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -e CARGO_REGISTRY_TOKEN -e RETE_RELEASE_VERSION \
            -v "$PWD:/work" -w /work rete-dev-release \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/publish_crates.sh --verify-auth "$RETE_RELEASE_VERSION"'
      - name: Preserve the crates.io publication receipt
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: crates-io-receipt-${{ needs.meta.outputs.version }}
          path: target/release/crates-io-receipt.json
          if-no-files-found: error

  attach-crates-receipt:
    name: attach crates.io receipt
    needs: [meta, publish-crates]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: crates-io-receipt-${{ needs.meta.outputs.version }}
          path: receipt
      - name: Attach the non-secret receipt to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.meta.outputs.tag }}"
          receipt/crates-io-receipt.json --clobber
