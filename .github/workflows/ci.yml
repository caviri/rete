name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RETE_DEV_IMAGE: rete-dev:${{ hashFiles('.devcontainer/Dockerfile') }}
  RETE_DEV_ARTIFACT: rete-dev-${{ hashFiles('.devcontainer/Dockerfile') }}

jobs:
  image:
    name: pinned development image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build the pinned image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ${{ env.RETE_DEV_IMAGE }}
          outputs: type=docker,dest=/tmp/rete-dev.tar
          cache-from: type=gha,scope=rete-dev
          cache-to: type=gha,mode=max,scope=rete-dev
      - name: Share the image with release-gate jobs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp/rete-dev.tar
          compression-level: 0
          retention-days: 1

  quality:
    name: quality
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Format, lint, tests, feature matrix, smoke, and qbench
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh quality'

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check the declared Rust 1.87 minimum
        run: |
          docker run --rm --user root \
            -e RUSTUP_TOOLCHAIN=1.87.0 -e CARGO_TARGET_DIR=/work/target-msrv \
            -v "$PWD:/work" -w /work rust:1.87.0-bookworm \
            sh -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libzstd-dev && cargo check --locked --workspace --exclude rete-bench'

  security:
    name: security
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Audit advisories, licenses, bans, and sources
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh security'

  wasm:
    name: wasm
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Rebuild every browser artifact from this commit
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target -e GITHUB_SHA="$GITHUB_SHA" \
            -e RETE_BUILD_STAMP=1.0.0-rc.1 \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/build_wasm.sh'
      - name: Verify provenance and generated browser files
        run: |
          test "$(python3 -c 'import json; print(json.load(open("docs/wasm-build.json"))["gitCommit"])')" = "$GITHUB_SHA"
          git diff --exit-code -- \
            web/pkg web/pkg-nomodules web/pkg-nomodules-async \
            docs/playground.html docs/rete_wasm.js docs/rete_wasm_bg.wasm \
            docs/rete_wasm_async.js docs/rete_wasm_async.wasm
      - name: Preserve exact build provenance
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ github.sha }}
          path: docs/wasm-build.json

  coverage:
    name: coverage
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Enforce core and CLI coverage floors
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh scripts/coverage.sh

  browser:
    name: browser
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Run local fixtures on PRs and the live R2 matrix on pushes
        run: |
          docker run --rm --user root --network host \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e PLAYWRIGHT_BROWSERS_PATH=/work/tests/gate/.playwright \
            -v "$PWD:/work" -w /work/tests/gate "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work; npm ci --no-audit --no-fund; npx playwright install chromium; mkdir -p .cache; cargo run -q --release -p rete-cli --manifest-path /work/Cargo.toml -- build fixtures/worldcup2026.nt -o .cache/worldcup2026.rete; if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node run.mjs --local; else node run.mjs; fi'

  package:
    name: package
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Build publishable crate archives
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work && cargo package --locked -p rete-core && cargo package --locked -p rete-cli --no-verify && cargo package --locked -p rete-wasm --no-verify'

  docs:
    name: docs
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Rustdoc, rendered docs, and links
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "$RETE_DEV_IMAGE" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh docs'
