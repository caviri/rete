name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RETE_DEV_ARTIFACT: rete-dev-image

jobs:
  # Detect which modules a change touches, so pushes and PRs only pay for
  # the jobs they can affect (workflow_dispatch still forces a full run).
  # The clients have their own paths-filtered workflows; this covers the
  # crates / browser-artifact / docs split inside the main CI.
  changes:
    name: detect affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      docs: ${{ steps.filter.outputs.docs }}
      scholar: ${{ steps.filter.outputs.scholar }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              # NO blanket '!**/*.md' here: dorny/paths-filter ORs its patterns,
              # so a lone negation matches every non-Markdown file and makes the
              # list below dead code. A docs-only commit then ran the whole
              # suite (coverage, wasm, interop, conformance) because the
              # generated docs/*.html sibling is not Markdown. These are the
              # real Rust inputs; docs prose reaches the `docs` filter only.
              - 'crates/**'
              - 'fuzz/**'
              - 'examples/**'
              # Every subdirectory of tests/ is named, not `tests/**`. The
              # scholar harness below lives under tests/ too and drives a shell
              # script, not the engine — running coverage, conformance and msrv
              # over a change to it is a cost with no question behind it. ADD
              # NEW tests/ SUBDIRECTORIES HERE; the enumeration is the only
              # thing keeping them covered.
              - 'tests/gate/**'
              - 'tests/interop/**'
              - 'tests/conformance-baseline.json'
              - 'rdf-tests/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'scripts/release_check.sh'
              - 'scripts/coverage.sh'
              # Run by release_check.sh's `quality` stage — a broken smoke test
              # fails that job, so it belongs on the same trigger as the job.
              - 'scripts/smoke.sh'
              # crates/rete-cli/tests/export_report_roundtrip.rs EXECUTES this
              # script: it feeds the real exporter's stderr to the script's own
              # awk parser. Editing the script can therefore fail `cargo test`,
              # which is the `quality` job, which is gated on this filter.
              - 'scripts/export_scholar_nquads.sh'
              - '.devcontainer/**'
              - '.github/workflows/ci.yml'
            wasm:
              # Same reasoning as `rust` above. The docs/* entries below are the
              # committed browser artifacts, which MUST still trigger the
              # provenance/parity gate; docs prose must not.
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'web/**'
              - 'tests/gate/**'
              - 'scripts/build_wasm.sh'
              - 'scripts/build_playground.py'
              - 'scripts/build_playground_async.sh'
              - 'scripts/stage_playground_datasets.py'
              - 'docs/playground.html'
              - 'docs/rete_wasm.js'
              - 'docs/rete_wasm_bg.wasm'
              - 'docs/rete_wasm_async.js'
              - 'docs/rete_wasm_async.wasm'
              - 'docs/wasm-build.json'
              - 'docs/coi-serviceworker.js'
              - '.devcontainer/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'scripts/check_docs_links.py'
              - '.devcontainer/**'
              - '.github/workflows/ci.yml'
            scholar:
              # The N-Quads export driver and its harness. Before this filter
              # existed a change to `export_scholar_nquads.sh` — 700+ lines
              # carrying the publication gate — matched nothing and ran NO job
              # at all. Same reasoning as `rust` above: an allow-list, never a
              # bare negation.
              - 'scripts/export_scholar_nquads.sh'
              - 'scripts/scholar-constellation.tsv'
              - 'tests/scholar/**'
              # Where the pinned `oxigraph` the parse check runs comes from.
              - '.devcontainer/**'
              - '.github/workflows/ci.yml'
            shell:
              # Every shell script in the repository, wherever it lives. The
              # Rust is linted by clippy and the browser code by the gate; the
              # shell was linted by nothing, including the 700+ lines that
              # decide what gets published.
              - '**/*.sh'
              - 'tests/shellcheck/**'
              - '.github/workflows/ci.yml'

  image:
    name: pinned development image
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.wasm == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.scholar == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Derive the immutable image tag
        id: identity
        run: echo "tag=rete-dev:$(sha256sum .devcontainer/Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the pinned image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: ${{ steps.identity.outputs.tag }}
          outputs: type=docker,dest=/tmp/rete-dev.tar
          cache-from: type=gha,scope=rete-dev
          cache-to: type=gha,mode=max,scope=rete-dev
      - name: Share the image with release-gate jobs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp/rete-dev.tar
          compression-level: 0
          retention-days: 1

  quality:
    name: quality
    needs: [changes, image]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Format, lint, tests, feature matrix, smoke, and qbench
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh quality'

  interop:
    name: Oxigraph interop
    # `rete export --format nq` names a grammar. This is the job that checks it
    # emits one, against a real store rather than our own reader: an unsanitized
    # export of a graph with invalid IRIs must be REJECTED by `oxigraph load`,
    # the `--sanitize-iris` export must load with a matching quad count, and a
    # dump whose only defect is an IRI with no scheme must still be rejected —
    # so the sanitizer can never be read as a promise it does not keep.
    #
    # It pulls a third-party image, so it is NOT in `tests/gate/gate.sh` (the
    # per-change browser matrix). It runs here on the same trigger as the other
    # network-bound check, W3C conformance: rust changes and workflow_dispatch.
    needs: [changes, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Export into a real Oxigraph, both sanitized and not
        env:
          # The harness launches the dev container itself; point it at the
          # pinned image this run already built instead of `docker compose`,
          # which would rebuild it.
          RETE_DEV_RUN: >-
            docker run --rm --user root
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup
            -e CARGO_TARGET_DIR=/work/target
            -v ${{ github.workspace }}:/work -w /work ${{ needs.image.outputs.tag }}
        run: bash tests/interop/oxigraph.sh

  shellcheck:
    name: shellcheck
    # Needs no dev image and no build: a 4 MB pinned container over the tracked
    # `*.sh`. That is why it can afford to sit on `**/*.sh` and run on any PR
    # that touches a shell script, while the heavier scholar and interop jobs
    # stay on their narrower triggers.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Lint every tracked shell script except the documented debt
        run: bash tests/shellcheck/run.sh

  scholar:
    name: scholar export driver
    # `scripts/export_scholar_nquads.sh` is 700+ lines and the publication gate
    # for the N-Quads constellation lives in it. Until this job existed a change
    # to it matched NO path filter and ran NO check whatsoever.
    #
    # Two halves. The parse check runs INSIDE the dev image, which is the whole
    # point: the image now carries the pinned `oxigraph`, and there is no docker
    # in there, so a passing parse can only have come from that binary. The
    # end-to-end loop runs at the HOST tier, where the driver is what it is on a
    # developer's machine.
    #
    # Deliberately NOT on the `rust` filter. What a rete change can break here
    # is already covered twice: `quality` runs the report round-trip test, which
    # feeds the real exporter's stderr to this script's own parser, and
    # `interop` puts a real rete export through a real Oxigraph. What is unique
    # to this job is the DRIVER's loop, and that changes when the script does.
    needs: [changes, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.scholar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: The independent parse check, and every way it can fail to run
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'bash tests/scholar/parse_check.sh'
      - name: The driver's whole loop, with no bucket and no network
        # Host tier, like `interop`: it orchestrates containers, so it cannot be
        # one. The dev image is reused for the rete side and the file server;
        # the driver, curl and the stub `hf` run on the runner. The driver's own
        # parse check takes the CONTAINER route from here, which is the half the
        # in-container step above cannot reach — between them both are covered.
        env:
          RETE_DEV_IMAGE: ${{ needs.image.outputs.tag }}
        run: bash tests/scholar/driver_e2e.sh

  msrv:
    name: msrv
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check the declared Rust 1.87 minimum
        run: |
          docker run --rm --user root \
            -e RUSTUP_TOOLCHAIN=1.87.0 -e CARGO_TARGET_DIR=/work/target-msrv \
            -v "$PWD:/work" -w /work rust:1.87.0-bookworm \
            sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libzstd-dev && cargo check --locked --workspace --exclude rete-bench'

  security:
    name: security
    needs: [changes, image]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Audit advisories, licenses, bans, and sources
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh security'

  wasm:
    name: wasm
    needs: [changes, image]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Rebuild every browser artifact from this commit
        run: |
          # No RETE_BUILD_STAMP here on purpose. The stamp is the workspace
          # version read from Cargo.toml, and build_wasm.sh now derives exactly
          # that when none is given — so the value CI stamps and the value a
          # local regeneration stamps are the same by construction rather than
          # by two copies of one regex agreeing. (It was hard-coded `0.3.0` here
          # once, which turns every version bump into a parity failure; then it
          # was computed here, which left the script defaulting to the source
          # SHA and cost #199 a CI cycle.)
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/build_wasm.sh'
      - name: Verify provenance and generated browser files
        run: |
          test "$(python3 -c 'import json; print(json.load(open("docs/wasm-build.json"))["gitCommit"])')" = "$GITHUB_SHA"
          # Only TRACKED artifacts belong here: web/pkg* are gitignored (git
          # diff on them was a silent no-op) and docs/rete_wasm.js/_bg.wasm
          # never existed. docs/engine is refreshed by build_wasm.sh now, so
          # the ESM copy the standalone docs pages import is guarded too.
          GUARDED="docs/playground.html docs/engine docs/rete_wasm_async.js docs/rete_wasm_async.wasm"
          if git diff --quiet -- $GUARDED; then
            echo "browser artifacts: byte-identical to this commit."
            exit 0
          fi
          # A failure here used to be `Binary files … differ` and nothing else,
          # and three unrelated mistakes produce exactly that line: stale
          # artifacts, a wrong RETE_BUILD_STAMP, and a shared CARGO_TARGET_DIR.
          # Three agents lost a CI cycle to it in one day, each diagnosing a
          # different one. Name which happened.
          git diff --stat -- $GUARDED
          python3 -P scripts/wasm_parity_triage.py $GUARDED
          exit 1
      - name: Preserve exact browser build
        # always(): keep the rebuilt artifacts even when the parity diff
        # fails, so a stale-artifact commit can be repaired from CI's own
        # byte-exact output instead of a local rebuild.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build-${{ github.sha }}
          path: |
            web/pkg
            web/pkg-nomodules
            web/pkg-nomodules-async
            docs/playground.html
            docs/rete_wasm.js
            docs/rete_wasm_bg.wasm
            docs/rete_wasm_async.js
            docs/rete_wasm_async.wasm
            docs/wasm-build.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: coverage
    needs: [changes, image]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Enforce core and CLI coverage floors
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh scripts/coverage.sh

  browser:
    name: browser
    needs: [image, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - name: Restore the exact WASM job output
        uses: actions/download-artifact@v7
        with:
          name: wasm-build-${{ github.sha }}
          path: .
      - run: docker load --input /tmp/rete-dev.tar
      - name: Run local fixtures on PRs and the live R2 matrix on pushes
        run: |
          docker run --rm --user root --network host \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e PLAYWRIGHT_BROWSERS_PATH=/work/tests/gate/.playwright \
            -v "$PWD:/work" -w /work/tests/gate "${{ needs.image.outputs.tag }}" \
            sh -lc 'git config --global --add safe.directory /work; npm ci --no-audit --no-fund; npx playwright install chromium; bash /work/tests/gate/fixtures.sh; if [ "$GITHUB_EVENT_NAME" = pull_request ]; then node run.mjs --local; else node run.mjs; fi'

  package:
    name: package
    needs: [changes, image]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Build core archive and validate dependent package manifests
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'set -eu; git config --global --add safe.directory /work; cargo package --locked -p rete-core; for crate in rete-cli rete-wasm; do cargo package --locked -p "$crate" --list > "/tmp/$crate.list"; grep -Fx Cargo.toml "/tmp/$crate.list"; grep -Fx README.md "/tmp/$crate.list"; grep -Fx LICENSE "/tmp/$crate.list"; done'

  docs:
    name: docs
    # Rust changes matter here too: rustdoc + docgen live in crates/.
    needs: [changes, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Rustdoc, rendered docs, and links
        run: |
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'git config --global --add safe.directory /work && bash scripts/release_check.sh docs'

  conformance:
    name: W3C SPARQL 1.1 conformance
    # The scorecard in docs/conformance.md was hand-committed and measured by
    # nobody: the harness existed but no workflow ran it, so a drop from 76% to
    # 60% would have merged green. It is a gate now — `--min-pass` makes the
    # harness EXIT NON-ZERO on regression (without it, it always exited 0, so
    # wiring it in would have measured the score and then ignored it).
    needs: [changes, image]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Fetch the W3C test suite
        # Not vendored (it is gitignored), so the suite is cloned shallowly.
        run: git clone --depth 1 https://github.com/w3c/rdf-tests.git rdf-tests
      - name: Score against the committed baseline
        run: |
          BASELINE=$(python3 -c "import json;print(json.load(open('tests/conformance-baseline.json'))['pass'])")
          echo "baseline: $BASELINE passing"
          docker run --rm --user root             -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup             -e CARGO_TARGET_DIR=/work/target             -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}"             sh -lc "git config --global --add safe.directory /work               && cargo build --release -p rete-cli               && pip install --quiet --break-system-packages rdflib               && python3 scripts/sparql_conformance.py                    --rete target/release/rete                    --suite rdf-tests/sparql/sparql11                    --min-pass $BASELINE                    --json conformance.json"
      - name: Publish the measured score
        if: always()
        run: cat conformance.json 2>/dev/null || echo "no score produced"

  preview:
    name: playground preview artifact
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'caviri/rete' &&
      needs.changes.outputs.wasm == 'true'
    permissions:
      contents: read
    needs: [changes, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ env.RETE_DEV_ARTIFACT }}
          path: /tmp
      - run: docker load --input /tmp/rete-dev.tar
      - name: Build and stage the immutable static preview
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BUILD_STAMP="${HEAD_SHA:0:12}"
          docker run --rm --user root \
            -e CARGO_HOME=/usr/local/cargo -e RUSTUP_HOME=/usr/local/rustup \
            -e CARGO_TARGET_DIR=/work/target \
            -e GITHUB_SHA="$HEAD_SHA" -e RETE_SOURCE_REVISION="$HEAD_SHA" \
            -e RETE_BUILD_STAMP="$BUILD_STAMP" \
            -v "$PWD:/work" -w /work "${{ needs.image.outputs.tag }}" \
            sh -lc 'set -eu; git config --global --add safe.directory /work; bash scripts/build_wasm.sh; rm -rf target/playground-preview; install -d target/playground-preview; install -m 0644 docs/playground.html docs/rete_wasm_async.js docs/rete_wasm_async.wasm docs/coi-serviceworker.js docs/wasm-build.json target/playground-preview/'
      - name: Upload only the static preview allowlist
        uses: actions/upload-artifact@v7
        with:
          name: playground-preview-${{ github.event.pull_request.head.sha }}
          path: target/playground-preview
          if-no-files-found: error
          retention-days: 1
