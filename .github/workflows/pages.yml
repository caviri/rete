name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "scripts/stage_pages.sh"
      - "tests/gate/checks/check_deployed.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage the site (landing at /, docs under /docs/, old URLs kept)
        run: bash scripts/stage_pages.sh _site
      - uses: actions/configure-pages@v5
      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every remote dataset has stable bytes, Range, and browser CORS
        run: python3 scripts/check_dataset_catalog.py --all
      - name: Install deployed-site browser check
        working-directory: tests/gate
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify the exact deployed commit and live lazy query
        working-directory: tests/gate
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: EXPECTED_SHA="$(git rev-parse --short=12 HEAD)" node checks/check_deployed.mjs
