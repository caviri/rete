name: Docs (GitHub Pages)

# Publishes the docs/ folder — the rendered HTML site (index, guides, SPEC,
# benchmarks) plus the self-contained WASM playground (docs/playground.html) — to
# GitHub Pages. The HTML is committed and kept in sync with its Markdown source by
# the CI "Docs HTML in sync" check, so this job just uploads the static files
# (nothing builds — no toolchain, no container needed).
#
# One-time repo setup: Settings → Pages → Build and deployment → Source =
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deploy; cancel an in-progress run if a newer one arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Serve files verbatim (don't let Jekyll drop/transform anything).
      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
