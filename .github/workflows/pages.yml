name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/gate/checks/check_deployed.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage docs with the exact deployed revision
        run: |
          mkdir _site
          cp -a docs/. _site/
          EXPECTED_SHA="$(git rev-parse --short=12 HEAD)" python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          page = Path("_site/playground.html")
          source = page.read_text(encoding="utf-8")
          source, count = re.subn(
              r'window\.RETE_BUILD = "[^"]*";',
              f'window.RETE_BUILD = "{os.environ["EXPECTED_SHA"]}";',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("playground build stamp was not found exactly once")
          page.write_text(source, encoding="utf-8")
          PY
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every remote dataset has stable bytes, Range, and browser CORS
        run: python3 scripts/check_dataset_catalog.py --all
      - name: Install deployed-site browser check
        working-directory: tests/gate
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify the exact deployed commit and live lazy query
        working-directory: tests/gate
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: EXPECTED_SHA="$(git rev-parse --short=12 HEAD)" node checks/check_deployed.mjs
