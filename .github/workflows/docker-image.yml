name: Docker image (reusable)

# Build ONE image for linux/amd64 + linux/arm64 and publish it to GHCR as a
# single multi-arch manifest list. Called by docker-publish.yml once per image.
#
# Each architecture is built on a runner of that architecture — `ubuntu-24.04`
# and `ubuntu-24.04-arm`, both free for this public repo and already used by
# release.yml. That matters most for rete-dev, which compiles ~8 cargo tools
# from source: the same build under QEMU emulation takes hours and risks the
# 6-hour job ceiling, while a native arm64 runner finishes in the usual time.
#
# The per-arch jobs push BY DIGEST (no tag), each writing its digest to an
# artifact; the merge job then stitches the digests into one tagged manifest
# list with `docker buildx imagetools create`. This is the only way to build the
# arches on separate machines and still ship them under one tag.

on:
  workflow_call:
    inputs:
      image:
        description: GHCR package name, e.g. rete-dev (owner is added automatically).
        required: true
        type: string
      context:
        description: Build context passed to buildx.
        required: true
        type: string
      file:
        description: Path to the Dockerfile, relative to the repository root.
        required: true
        type: string
      description:
        description: One-line package description (OCI annotation + GHCR listing).
        required: false
        type: string
        default: ""
      version-tag:
        description: >-
          Extra immutable tag, e.g. a content hash of the Dockerfile. Skipped
          when empty.
        required: false
        type: string
        default: ""
      cache-from:
        description: buildx cache-from spec, or empty to disable. `{arch}` is substituted.
        required: false
        type: string
        default: ""
      cache-to:
        description: buildx cache-to spec, or empty to disable. `{arch}` is substituted.
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 60

permissions:
  contents: read
  packages: write

env:
  # github.repository_owner is already lowercase here; GHCR rejects uppercase.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}

jobs:
  build:
    name: ${{ inputs.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # One architecture failing must not throw away the other's build.
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6

      - name: Collect OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ inputs.description }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Substitute {arch} into the cache specs
        id: cache
        shell: bash
        env:
          CACHE_FROM: ${{ inputs.cache-from }}
          CACHE_TO: ${{ inputs.cache-to }}
        run: |
          echo "from=${CACHE_FROM//\{arch\}/${{ matrix.arch }}}" >> "$GITHUB_OUTPUT"
          echo "to=${CACHE_TO//\{arch\}/${{ matrix.arch }}}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          # Attestations turn each per-arch push into a nested image index, which
          # leaves `unknown/unknown` entries in the merged manifest list. The
          # workspace SBOM comes from release.yml's cyclonedx job instead.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest for the merge job
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ inputs.image }} manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ inputs.image }}-*
          merge-multiple: true

      - name: Resolve the tags for this event
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotate the manifest list itself, not the per-arch manifests.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ inputs.description }}
          # `latest` and the truncated {major}.{minor} tags deliberately skip
          # prereleases: 1.0.0-rc.1 must not become `latest` or move `1.0`.
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.version-tag }},enable=${{ inputs.version-tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list from the per-arch digests
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          # Both are newline-separated lists; annotation values contain spaces,
          # so they are collected into an array rather than spliced through a
          # `$(...)`, which word splitting would tear apart.
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then args+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          for digest in *; do args+=("$REGISTRY_IMAGE@sha256:$digest"); done
          printf 'arg: %q\n' "${args[@]}"
          docker buildx imagetools create "${args[@]}"

      - name: Confirm both architectures made it into the list
        shell: bash
        run: |
          docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}" \
            | tee /tmp/inspect.txt
          for want in linux/amd64 linux/arm64; do
            grep -q "$want" /tmp/inspect.txt || { echo "missing $want" >&2; exit 1; }
          done

      - name: Summarise
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### \`${{ inputs.image }}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
