name: Python client tests

# Runs ONLY when the Python client (or the engine it binds) changes — the
# client is excluded from the cargo workspace, so this workflow is its whole
# CI: lint the binding crate, build the wheel, install it with uv, pytest.
on:
  push:
    branches: [main, "release-*"]
    paths:
      - "clients/python/**"
      - "crates/rete-core/**"
      - ".github/workflows/python-test.yml"
  pull_request:
    paths:
      - "clients/python/**"
      - "crates/rete-core/**"
      - ".github/workflows/python-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path clients/python/Cargo.toml
      - run: cargo clippy --manifest-path clients/python/Cargo.toml --all-targets -- -D warnings

  test:
    name: wheel + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m clients/python/Cargo.toml
          manylinux: auto
      - uses: astral-sh/setup-uv@v5
      - name: Install the wheel with uv and run the test suite
        # pandas + rdflib cover the optional integrations (query_df, build
        # from an rdflib Graph); the live remote smoke runs here too — it is
        # the only place the real R2 Range/CORS contract gets exercised.
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl pytest pandas rdflib
          RETE_REMOTE_URL=https://data.graphplaza.com/boe/boe.rete \
            .venv/bin/python -m pytest clients/python/tests -q
