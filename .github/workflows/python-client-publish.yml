name: Python client publish

# Release pipeline only: wheels + sdist + PyPI publish on the `v*` release tag,
# the one tag that releases every channel (docs/release.md). Until 0.3.6 the
# Python client had its own `py-v*` tags; those stay in the repository as
# history and no longer trigger anything.
#
# PyPI's trusted publisher for `rete-graph` points at THIS filename
# (python-client-publish.yml) + the `pypi` environment — renaming either breaks
# publishing until the PyPI form is updated. It is also why this stays a
# workflow of its own, triggered by the same tag as release.yml, instead of a
# job release.yml calls: PyPI does not accept a reusable workflow as the
# trusted publisher. The `pypi` environment admits `v*` tags only.
#
# workflow_dispatch is a dry run from any branch: test, every wheel, the sdist,
# and no publish. Day-to-day testing lives in python-test.yml, paths-filtered
# to clients/python/ and the engine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: clients/python/Cargo.toml

jobs:
  test:
    name: build + pytest (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The same check release.yml, js-client-publish.yml and docker-publish.yml
      # make, on the same commit: the tag must equal every channel's version.
      # All four agree, so a mis-stamped tag stops every channel before any of
      # them publishes, instead of shipping the ones that happened to match.
      - name: The tag must name the version of every channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/sync_versions.py --check-tag "$GITHUB_REF_NAME"
      - name: Every channel carries one version (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/sync_versions.py --check
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m ${{ env.MANIFEST }}
          manylinux: auto
      - uses: astral-sh/setup-uv@v5
      - name: Install the wheel with uv and run the test suite
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl pytest pandas rdflib
          .venv/bin/python -m pytest clients/python/tests -q

  # The four native abi3 wheels (artifacts `wheel-<platform>`), from the
  # reusable workflow release.yml and docker-publish.yml build theirs with, so
  # the wheels on PyPI, in the Blender add-on and in the relay image come from
  # one definition and one commit. Only the `publish` job below needs to live
  # in this file for PyPI's trusted publisher; building elsewhere is fine.
  wheels:
    name: native wheels
    needs: test
    uses: ./.github/workflows/python-wheels.yml

  wheel-pyodide:
    name: wheel pyodide (browser Python)
    # PyEmscripten wheel (PEP 783) for Pyodide runtimes — JupyterLite, marimo
    # WASM. Not abi3: one wheel per Pyodide ABI year, built by cibuildwheel
    # against the pinned emsdk. PyPI accepts the pyemscripten_* tags.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # PER-TARGET toolchains — the two Pyodide generations were built with
      # different exception-handling ABIs, and a wheel built with the wrong
      # one crashes at import ("cannot resolve symbol invoke_*"):
      #   cp313 / Pyodide 0.29: nightly (pyodide-build passes -Z emscripten
      #     flags; nightly must be >= 1.87 for the workspace MSRV yet old
      #     enough to still carry -Z emscripten-wasm-eh) + build-std, because
      #     that nightly's PREBUILT emscripten std lacks wasm-EH.
      #   cp314 / Pyodide 314: stable 1.93 — wasm-EH is the default there,
      #     prebuilt std included; no flags, no build-std.
      # RUSTUP_TOOLCHAIN env overrides the repo's rust-toolchain.toml pin.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          targets: wasm32-unknown-emscripten
          components: rust-src
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-emscripten
      - name: Build the cp313 (Pyodide 0.29) wheel — nightly + build-std
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-06-01
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort,panic_unwind
          CIBW_BUILD: cp313-*
        run: |
          pip install cibuildwheel
          cibuildwheel --platform pyodide --output-dir dist clients/python
      - name: Build the cp314 (Pyodide 314) wheel — stable
        env:
          RUSTUP_TOOLCHAIN: 1.93.0
          CIBW_BUILD: cp314-*
        run: cibuildwheel --platform pyodide --output-dir dist clients/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-pyodide
          path: dist
      # Pyodide 0.29's installer predates PEP 783, which renamed the platform
      # tag `pyodide_*` -> `pyemscripten_*`. It therefore cannot resolve the
      # wheel PyPI now requires, so docs/python.md points those users at a
      # retagged copy on our own bucket. Same compiled artifact, old spelling.
      #
      # This MUST stay out of `dist`: the publish job uploads that directory to
      # PyPI, which rejects the legacy tag. Hence a separate artifact, and a
      # separate manual upload step (no R2 credentials exist in Actions) —
      # see scripts/publish_pyodide_wheel.sh and the release runbook.
      - name: Retag the 2025 ABI wheel for pre-PEP-783 installers
        run: |
          set -eu
          mkdir -p dist-legacy
          # Depending on the cibuildwheel/pyodide-build version, the 0.29 target
          # may already emit the legacy spelling. Accept either and normalize.
          legacy=$(find dist -maxdepth 1 -name '*pyodide_2025_0_wasm32.whl' | head -1)
          modern=$(find dist -maxdepth 1 -name '*pyemscripten_2025_0_wasm32.whl' | head -1)
          if [ -n "$legacy" ]; then
            echo "cp313 target already emits the legacy tag; copying as-is"
            cp "$legacy" dist-legacy/
          elif [ -n "$modern" ]; then
            echo "retagging $(basename "$modern")"
            pip install wheel
            cp "$modern" dist-legacy/
            wheel tags --platform-tag pyodide_2025_0_wasm32 --remove dist-legacy/*.whl
          else
            echo "no 2025-ABI Pyodide wheel was built, so the fallback wheel" >&2
            echo "documented in docs/python.md cannot be produced. Either the" >&2
            echo "cp313/Pyodide-0.29 target was dropped — in which case delete" >&2
            echo "this step and that paragraph together — or the build failed." >&2
            ls -l dist >&2
            exit 1
          fi
          ls -l dist-legacy
      - uses: actions/upload-artifact@v7
        with:
          name: pyodide-legacy-wheel
          path: dist-legacy
          if-no-files-found: error

  sdist:
    name: sdist
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, wheel-pyodide, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing (OIDC): configure this repo + workflow + environment
    # as a "trusted publisher" for the rete-graph project on pypi.org — no
    # API token secret needed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # Four native wheels, two Pyodide wheels and the sdist, every one of them
      # the tag's version. PyPI never takes a version back, so a stray file is
      # refused here rather than published.
      - name: Upload set is exactly this version
        run: |
          version=${GITHUB_REF_NAME#v}
          ls -l dist
          stray=$(find dist -type f ! -name "rete_graph-$version-*.whl" ! -name "rete_graph-$version.tar.gz")
          test -z "$stray" || { echo "not version $version: $stray" >&2; exit 1; }
          test "$(find dist -type f | wc -l)" -eq 7 || { echo "expected 7 files" >&2; exit 1; }
      - uses: astral-sh/setup-uv@v5
      - run: uv publish --trusted-publishing always dist/*
