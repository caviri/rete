name: Python client publish

# Release pipeline only: wheels + sdist + PyPI publish on `py-v*` tags.
# PyPI's trusted publisher for `rete-graph` points at THIS filename
# (python-client-publish.yml) + the `pypi` environment — renaming the file
# breaks publishing until the PyPI form is updated. Day-to-day testing lives
# in python-test.yml, paths-filtered to clients/python/ and the engine.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: clients/python/Cargo.toml

jobs:
  test:
    name: build + pytest (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -m ${{ env.MANIFEST }}
          manylinux: auto
      - uses: astral-sh/setup-uv@v5
      - name: Install the wheel with uv and run the test suite
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl pytest pandas rdflib
          .venv/bin/python -m pytest clients/python/tests -q

  wheels:
    name: wheel ${{ matrix.platform.name }}
    # Wheels are abi3-py39: one artifact per platform covers CPython >= 3.9.
    needs: test
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the others' wheels.
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          # ring's pregenerated ARM assembly needs a newer cross-assembler
          # than manylinux2014 ships (`#error "ARM assembler must define
          # __ARM_ARCH"`); the 2_28 image's toolchain defines it. Floor is
          # glibc 2.28 (Debian 10+ / Ubuntu 20.04+) — fine for aarch64.
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: 2_28 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-universal2, runner: macos-latest, target: universal2-apple-darwin }
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: --release --out dist -m ${{ env.MANIFEST }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist

  wheel-pyodide:
    name: wheel pyodide (browser Python)
    # PyEmscripten wheel (PEP 783) for Pyodide runtimes — JupyterLite, marimo
    # WASM. Not abi3: one wheel per Pyodide ABI year, built by cibuildwheel
    # against the pinned emsdk. PyPI accepts the pyemscripten_* tags.
    needs: test
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # pyodide-build 0.35 drives cargo with -Z emscripten flags: needs a
      # nightly in a specific window — >=1.87 (workspace MSRV) but old enough
      # to still carry `-Z emscripten-wasm-eh` (newer toolchains made it the
      # default and dropped the flag). RUSTUP_TOOLCHAIN must also override the
      # repo's rust-toolchain.toml stable pin. Revisit when pyodide-build
      # supports stable Rust (upstream main already pins 1.93).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-01
          targets: wasm32-unknown-emscripten
          components: rust-src
      - name: Build the PyEmscripten (Pyodide) wheel
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-06-01
          # Rust's prebuilt emscripten std lacks wasm-EH; recompile it with
          # the same flags (rust-src above) or the module imports JS-EH
          # invoke_* stubs that Pyodide's runtime refuses to link.
          CARGO_UNSTABLE_BUILD_STD: std,panic_abort,panic_unwind
          # cp313 / Pyodide 0.29 only: these pins are WRONG for cp314 /
          # Pyodide 314, whose toolchain is stable Rust 1.93 + Emscripten 5 —
          # a cp314 wheel built here crashes at import ("cannot resolve
          # symbol invoke_i"). Re-enable with a per-target toolchain once
          # pyodide-build supports stable Rust.
          CIBW_SKIP: cp314-*
        run: |
          pip install cibuildwheel
          cibuildwheel --platform pyodide --output-dir dist clients/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-pyodide
          path: dist

  sdist:
    name: sdist
    needs: test
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m ${{ env.MANIFEST }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, wheel-pyodide, sdist]
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing (OIDC): configure this repo + workflow + environment
    # as a "trusted publisher" for the rete-graph project on pypi.org — no
    # API token secret needed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v5
      - run: uv publish --trusted-publishing always dist/*
