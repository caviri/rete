name: R client tests

# Runs ONLY when the R client or the engine crate it binds changes: compile
# the extendr crate, regenerate wrappers + docs, and run the testthat suite.
on:
  push:
    branches: [main, "release-*"]
    paths:
      - "clients/r/**"
      - "crates/rete-core/**"
      - ".github/workflows/r-test.yml"
  pull_request:
    paths:
      - "clients/r/**"
      - "crates/rete-core/**"
      - ".github/workflows/r-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: extendr + testthat
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      # The crate builds with the repo's pinned stable toolchain; the R side
      # only needs cargo on PATH (SystemRequirements in DESCRIPTION).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/r/src/rust
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: clients/r
          extra-packages: |
            any::rextendr
            any::devtools
            any::testthat
      - name: Regenerate extendr wrappers + roxygen docs
        working-directory: clients/r
        run: Rscript -e 'rextendr::document()'
      - name: Wrappers must be committed in sync with the Rust surface
        run: git diff --exit-code clients/r/R/extendr-wrappers.R
      - name: Run the testthat suite
        working-directory: clients/r
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'
      # devtools::check would fail here: R CMD build tarballs clients/r alone,
      # where the ../../../../crates/rete-core path dependency cannot resolve.
      # The prep script embeds a standalone rete-core (cargo package resolves
      # the workspace-inherited fields) — the same shape a CRAN submission uses.
      - name: R CMD check (CRAN preflight, no manual)
        run: |
          bash scripts/r_cran_prep.sh /tmp/r-stage
          cd /tmp/r-stage
          R CMD build rete
          R CMD check --no-manual rete_*.tar.gz
