# Renders the "Sponsor" button on the repository page. GitHub only reads this
# file from the default branch, so a change here has no effect until it lands
# on main.
#
# Every entry is a *handle*, not a URL — GitHub builds the link itself
# (patreon: caviri → https://www.patreon.com/caviri). A wrong handle silently
# points the button at somebody else's account, so only fill in the ones whose
# spelling is known. Ko-fi is the handle the docs footer already links
# (crates/docgen/src/main.rs), so all four agree.
github: caviri
patreon: caviri
open_collective: caviri
ko_fi: caviri
