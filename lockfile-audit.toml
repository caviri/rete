[[exception]]
id = "RUSTSEC-2024-0436"
crate = "paste"
lockfiles = ["clients/r/src/rust"]
reason = """
paste is unmaintained (informational, no vulnerability, no patched release).
It is a proc-macro, so it runs at compile time only and none of it is in the
built R library. It arrives through extendr-api, which the R client pins to the
0.8 line for rextendr's generated plumbing; the newest extendr-api (0.9.0) still
depends on it, so no upgrade removes it."""
review_by = 2027-01-21

[[exception]]
id = "RUSTSEC-2024-0370"
crate = "proc-macro-error"
lockfiles = ["clients/tauri/src-tauri"]
reason = """
Unmaintained (informational). A compile-time proc-macro pulled by glib-macros
and gtk3-macros 0.18, i.e. Tauri's Linux (GTK 3 / WebKitGTK) backend. The
explorer is built and shipped for macOS and Windows only, where that backend is
not compiled. Goes away when Tauri leaves gtk3-rs."""
review_by = 2027-01-21

[[exception]]
id = "RUSTSEC-2024-0429"
crate = "glib"
lockfiles = ["clients/tauri/src-tauri"]
reason = """
Unsound VariantStrIter iterator impls in glib 0.18 (fixed in 0.20). glib 0.18 is
pinned by Tauri 2's Linux backend (webkit2gtk / gtk 0.18), which the explorer
does not build: its installers are macOS and Windows only, so no glib code
ships. Goes away when Tauri leaves gtk3-rs."""
review_by = 2027-01-21

