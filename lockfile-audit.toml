# Which lockfiles the dependency audit covers, and the ONLY advisories it lets
# through. Read by scripts/audit_lockfiles.py, which CI's `security` job runs on
# every change to a lockfile or manifest and on the nightly schedule, and which
# `scripts/publish_crates.sh` runs (for the workspace lockfile) before anything
# reaches crates.io. There is no other list: deny.toml's [advisories] ignore must
# equal the exceptions that name "." and the script fails when they differ.
#
# The rules the script enforces, so this file cannot rot quietly:
#   - every tracked Cargo.lock / package-lock.json appears below, audited or
#     skipped with a reason; a new one fails the run until it is listed;
#   - every finding (vulnerability, unmaintained, unsound, yanked, notice) fails
#     unless an [[exception]] names its id AND the lockfile it was found in —
#     there are no blanket or wildcard ignores, and a yanked crate cannot be
#     excepted at all (update the lockfile);
#   - an exception that no longer matches a finding fails ("stale": delete it);
#   - an exception past its `review_by` date fails: re-check whether a fix has
#     shipped, then either remove the exception or renew it with a new date and,
#     if anything changed, a new reason. Renewals are at most a quarter apart.

# ---------------------------------------------------------------------------
# Cargo projects. `path` is the directory holding Cargo.toml.
# `lockfile = "generated"` marks a project that commits no Cargo.lock because
# its build resolves fresh every time; the audit resolves it fresh too (exactly
# what the next build would ship) and deletes the generated file afterwards.
# ---------------------------------------------------------------------------

[[cargo]]
path = "."
ships = "crates.io (rete-core, rete-graph, rete-cli, rete-wasm), the CLI archives and images, the browser engine, the npm client's wasm"

[[cargo]]
path = "clients/python"
ships = "the PyPI wheels and sdist of rete-graph, and the Pyodide wheels"

[[cargo]]
path = "clients/r/src/rust"
ships = "the R package's compiled library"

[[cargo]]
path = "clients/java/ffi"
lockfile = "generated"
ships = "rete_ffi.wasm inside the Java client JAR"

[[cargo]]
path = "clients/tauri/src-tauri"
ships = "the Rete File Explorer installers (macOS and Windows only, desktop-release.yml)"

[[cargo]]
path = "fuzz"
ships = "nothing (the cargo-fuzz harness), audited so its lockfile stays honest"

# ---------------------------------------------------------------------------
# npm packages, audited with `npm audit --omit=dev`: only what ships. Build and
# test tooling (devDependencies) is out of scope here.
# ---------------------------------------------------------------------------

[[npm]]
path = "clients/js"
ships = "the npm package rete-graph (no runtime dependencies today; this keeps it that way knowingly)"

[[npm]]
path = "clients/mcpb"
ships = "the Claude Desktop extension (rete.mcpb), whose server bundles @modelcontextprotocol/sdk and zod"

[[npm]]
path = "web/playground-src/cm6"
ships = "the CodeMirror bundle inlined into docs/playground.html"

[[npm]]
path = "tests/gate"
skip = "test harness only (the browser regression gate); its Playwright pin decides which Chromium the gate measures and moves deliberately"

[[npm]]
path = "experiments/graph-map"
skip = "experiment, ships nothing"

# ---------------------------------------------------------------------------
# Exceptions. `lockfiles` lists project paths from above, never a wildcard.
# ---------------------------------------------------------------------------

[[exception]]
id = "RUSTSEC-2026-0194"
crate = "quick-xml"
lockfiles = [".", "clients/python", "clients/r/src/rust", "clients/java/ffi", "clients/tauri/src-tauri", "fuzz"]
reason = """
quick-xml 0.37.5: quadratic duplicate-attribute scan, fixed in 0.41. Every
published oxrdfxml and sparesults (latest checked: oxrdfxml 0.2.5 and
sparesults 0.3.5, 2026-10-18) still requires quick-xml ^0.37, so the fix is
unreachable from rete-core. Availability only: the exposure is a caller feeding
untrusted RDF/XML to a build; no confidentiality or integrity impact.
Remove when Oxigraph ships a quick-xml >= 0.41 bump."""
review_by = 2027-01-21

