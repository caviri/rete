[workspace]
resolver = "2"
members = [
    "crates/rete-core",
    "crates/rete-graph",
    "crates/rete-cli",
    "crates/rete-wasm",
    "crates/docgen",
    "crates/bench",
]
# The cargo-fuzz harness is its own (nightly, instrumented) build — never part of
# the normal workspace build/test. See fuzz/Cargo.toml.
# Language clients under clients/ likewise own their toolchains: the Python
# package (PyO3 + maturin) builds and locks independently so the workspace
# release gates (--locked checks, feature matrix, coverage floors) stay
# untouched by binding-only changes. Future clients (R, Go) follow the same
# pattern — clients/ consumes crates/, never the other way around.
exclude = ["fuzz", "clients/python", "clients/r/src/rust", "clients/java/ffi", "clients/tauri/src-tauri"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/caviri/rete"
homepage = "https://caviri.github.io/rete/"
readme = "README.md"
rust-version = "1.87"

[workspace.dependencies]
# RDF model + SPARQL, reused rather than reinvented (see docs/SPEC.md §2).
# `rdf-star` enables quoted triples (`<< s p o >>`) in the parsers and SPARQL.
# Oxigraph's own RFC 3987 IRI parser -- the crate its N-Triples reader
# validates with. Already in this tree via `oxrdf`; named here so `rete-core`
# can call it directly and decide validity the way the reference loader does.
oxiri = "0.2"
oxrdf = { version = "0.2", features = ["rdf-star"] }
oxttl = { version = "0.1", features = ["rdf-star"] }
# The RDF 1.2 Turtle/TriG reader, ALONGSIDE the 0.1 line above rather than
# instead of it. The two are semver-incompatible, which is the whole reason they
# coexist: 0.1 reads `<< s p o >>` as an RDF-star QUOTED TRIPLE, 0.2 reads the
# same bytes as an RDF 1.2 REIFIER, and no single parser can mean both at once.
# `--quoted-triple-syntax` says which one an input file means. Renamed because
# one `[dependencies]` table cannot hold two entries called `oxttl`; it is the
# same crate, two major lines, the way `oxrdf` 0.2 and 0.3 already sit in
# Cargo.lock together.
oxttl12 = { package = "oxttl", version = "0.2", features = ["rdf-12"] }
# The RDF 1.2 term model the 0.2 parsers hand back. `oxttl` does not re-export
# it, so naming it here is the only way to match on a `GraphName`; it adds no
# code that `oxttl12` was not already pulling in.
oxrdf12 = { package = "oxrdf", version = "0.3", features = ["rdf-12"] }
oxrdfxml = "0.1"
spargebra = { version = "0.3", features = ["rdf-star"] }
serde_json = "1"
# Range reads from S3/GCS/HTTP and content hashing / compression.
object_store = "0.11"
blake3 = "1"
zstd = "0.13"
# Errors + CLI.
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
