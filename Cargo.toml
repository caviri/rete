[workspace]
resolver = "2"
members = [
    "crates/rete-core",
    "crates/rete-cli",
    "crates/rete-wasm",
    "crates/docgen",
    "crates/bench",
]
# The cargo-fuzz harness is its own (nightly, instrumented) build — never part of
# the normal workspace build/test. See fuzz/Cargo.toml.
# Language clients under clients/ likewise own their toolchains: the Python
# package (PyO3 + maturin) builds and locks independently so the workspace
# release gates (--locked checks, feature matrix, coverage floors) stay
# untouched by binding-only changes. Future clients (R, Go) follow the same
# pattern — clients/ consumes crates/, never the other way around.
exclude = ["fuzz", "clients/python", "clients/r/src/rust"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/caviri/rete"
homepage = "https://caviri.github.io/rete/"
readme = "README.md"
rust-version = "1.87"

[workspace.dependencies]
# RDF model + SPARQL, reused rather than reinvented (see docs/SPEC.md §2).
# `rdf-star` enables quoted triples (`<< s p o >>`) in the parsers and SPARQL.
oxrdf = { version = "0.2", features = ["rdf-star"] }
oxttl = { version = "0.1", features = ["rdf-star"] }
oxrdfxml = "0.1"
spargebra = { version = "0.3", features = ["rdf-star"] }
serde_json = "1"
# Range reads from S3/GCS/HTTP and content hashing / compression.
object_store = "0.11"
blake3 = "1"
zstd = "0.13"
# Errors + CLI.
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
