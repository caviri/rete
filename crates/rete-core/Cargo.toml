[package]
name = "rete-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Core format types for the Rete cloud-native RDF graph file."
documentation = "https://docs.rs/rete-core"
readme = "README.md"
keywords = ["rdf", "sparql", "graph", "database", "range-queries"]
categories = ["database", "data-structures", "web-programming"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

# docs.rs builds default features only, which would hide the `parallel` module.
# The builder is native Linux with a C toolchain, so `compression` + `rayon`
# both build there.
[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror.workspace = true
oxiri.workspace = true
oxrdf.workspace = true
oxttl.workspace = true
# The RDF 1.2 Turtle/TriG reader (`--quoted-triple-syntax rdf12`). Behind a
# feature because it is a SECOND complete Turtle/TriG parser and rete-core is
# also the wasm engine; see the `rdf12-turtle` feature below for what it costs
# and who pays.
oxttl12 = { workspace = true, optional = true }
oxrdf12 = { workspace = true, optional = true }
oxrdfxml.workspace = true
spargebra.workspace = true
# Derive-based (de)serialization for the Dataset Card types in `card_derive` /
# `card_queries`. Pure Rust, no_std-capable, and already a transitive dependency
# of serde_json — `serde_derive` is a build-time proc macro, so it costs the
# wasm nothing beyond the (De)Serialize impls actually reached.
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
blake3.workspace = true
# Pure-Rust zstd *decoder* — the decode path for a target WITHOUT a C toolchain
# (wasm, or a `--no-default-features` build). When the `compression` feature is
# on (native, incl. the CLI), BOTH encode and decode go through the faster C
# `zstd` below instead; this crate is then only the wasm decoder.
ruzstd = "0.7"
# Tiny pure-Rust regex engine for SPARQL `REGEX(...)` — `regex-lite` keeps the
# wasm small (no SIMD/aho-corasick), unlike the full `regex` crate.
regex-lite = "0.1"
# Pure-Rust hashes for the SPARQL hash built-ins (MD5/SHA1/SHA2 family). All
# RustCrypto, no C, so they compile to wasm too.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# Randomness for the SPARQL RAND/UUID/STRUUID/BNODE built-ins. On
# wasm32-unknown-unknown getrandom has no default backend: a *browser* consumer
# turns on the `wasm-js` feature below (crypto.getRandomValues); a non-browser
# wasm host (Chicory/WASI/Wasmtime) must supply its own via getrandom's `custom`
# backend. Native targets use the OS backend and need neither.
getrandom = "0.2"
zstd = { workspace = true, optional = true }
# Data-parallel query evaluator (prototype). Behind the `parallel` feature so it
# is never pulled into wasm (the wasm crate builds with --no-default-features).
rayon = { version = "1", optional = true }

[dev-dependencies]
# Property-based testing (tests only — never shipped, so the dep weight and the
# transitive `rand` are fine here). Generates random graphs/queries and shrinks
# any counterexample to a minimal failing case — the SQLite-style invariant net.
proptest = "1"

[features]
default = ["compression", "rdf12-turtle"]
# zstd needs a C toolchain; disable for targets that lack one (e.g. wasm).
compression = ["dep:zstd"]
# Read the **RDF 1.2** Turtle/TriG surface (`<<( s p o )>>` triple terms,
# `<< s p o >>` reifiers, `{| … |}` annotations, `"…"@lang--dir` literals) as
# well as the RDF-star one, under `--quoted-triple-syntax rdf12`. It is a whole
# second Turtle/TriG parser — `oxttl` 0.2 + `oxrdf` 0.3 beside the 0.1/0.2 pair
# — so it is a feature, not a fact.
#
# ON by default, which means every NATIVE build has it: the CLI, the Python /
# R / Tauri clients, the fuzzer. It is OFF for wasm, and NOT as a size decision.
# `oxrdf` 0.3 depends on `rand` 0.9 -> `getrandom` 0.3, which has no backend at
# all on `wasm32-unknown-unknown`; supplying one means
# `RUSTFLAGS=--cfg getrandom_backend="wasm_js"`, which links wasm-bindgen JS
# glue into the module and breaks precisely the non-browser wasm hosts this
# crate goes out of its way to support (Chicory on the JVM, WASI — see the
# `wasm-js` feature below). The browser engine therefore keeps `oxttl` 0.1 and
# the browser artifacts are byte-for-byte what they were.
#
# Turning it off costs only the RDF 1.2 *Turtle/TriG* reader. N-Triples and
# N-Quads still take `<<( s p o )>>` everywhere, because that reader is rete's
# own; asking for `--quoted-triple-syntax rdf12` on Turtle/TriG in such a build
# is refused by name rather than read as RDF-star.
rdf12-turtle = ["dep:oxttl12", "dep:oxrdf12"]
# Prototype data-parallel query evaluator. NOT default; wasm must never enable it
# (wasm has no threads). Enables the `parallel` module + `rayon`.
parallel = ["dep:rayon"]
# getrandom's browser backend (crypto.getRandomValues, via js-sys/wasm-bindgen).
# Enable ONLY for a wasm build that runs in a browser — it makes the module
# import wasm-bindgen JS glue, which a non-browser wasm host (Chicory on the JVM,
# WASI) cannot link. Those hosts leave this off and register a `custom` backend.
wasm-js = ["getrandom/js"]

# The parallel benchmark only compiles with the `parallel` feature (it uses
# rayon + the feature-gated `parallel` module). Without the gate, a default
# `cargo build --examples` would try to build it and fail.
[[example]]
name = "parallel_bench"
required-features = ["parallel"]
