[package]
name = "rete-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Browser/WASM bindings for querying Rete graph files."
documentation = "https://docs.rs/rete-wasm"
readme = "README.md"
keywords = ["rdf", "sparql", "wasm", "browser"]
categories = ["wasm", "web-programming", "database"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

# Without this docs.rs would document the crate for x86_64 Linux, where the
# `web-sys`/`js-sys` surface this crate is built on is meaningless. The
# experimental `threads`/`asyncify` features stay off: they need a nightly
# build-std toolchain and a wasm-opt post-pass that docs.rs does not run.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# OFF by default. The default wasm build stays single-threaded and `file://`-able.
default = []
# EXPERIMENTAL browser multithreading. Pulls in rayon (via rete-core/parallel)
# and wasm-bindgen-rayon's Web-Worker-backed thread pool. Requires a nightly +
# build-std wasm build AND a cross-origin-isolated (COOP/COEP) server — see
# scripts/build_playground_threads.sh and scripts/serve_coi.py. NOT for the
# normal `web/pkg` build.
threads = ["rete-core/parallel", "dep:wasm-bindgen-rayon"]
# EXPERIMENTAL Asyncify reads. Routes every remote range read through one async
# import (`env.rete_fetch_ranges`, a `Promise.all` of `fetch`) instead of sync
# XHR, so the synchronous engine fetches a query's byte ranges CONCURRENTLY with
# no SharedArrayBuffer / cross-origin isolation. The wasm must then be run through
# `wasm-opt --asyncify --pass-arg=asyncify-imports@env.rete_fetch_ranges` and the
# worker must drive the suspend/rewind loop — see scripts/build_playground_async.sh.
# A separate artifact (web/pkg-nomodules-async); the default build is unchanged.
asyncify = []

[dependencies]
# No default features: the C zstd encoder isn't available on wasm; the pure-Rust
# ruzstd decoder in rete-core reads compressed files just fine. `wasm-js` gives
# getrandom the browser backend (crypto.getRandomValues) it needs on
# wasm32-unknown-unknown — this crate always runs in a JS host.
rete-core = { version = "=0.3.2", path = "../rete-core", default-features = false, features = ["wasm-js"] }
wasm-bindgen = "0.2"
serde_json = "1"
# Sync-XHR range reader for the in-worker remote-query path (`sparql_url`).
js-sys = "0.3"
# `Blob` + `FileReaderSync` are the LOCAL half of the same range reader: a file
# the user picked is read with `Blob.slice()` + a synchronous `FileReaderSync`
# (worker-only, like sync XHR), so a local open costs the same handful of ranges
# a remote one does instead of `arrayBuffer()`-ing the whole file. See
# `LOCAL_SCHEME` in src/lib.rs.
web-sys = { version = "0.3", features = ["Blob", "FileReaderSync", "XmlHttpRequest", "XmlHttpRequestResponseType", "console"] }
# Threaded variant only (feature = "threads"). 1.3 targets wasm-bindgen 0.2.x,
# matching the 0.2.122 already pinned in Cargo.lock.
wasm-bindgen-rayon = { version = "1.3", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
