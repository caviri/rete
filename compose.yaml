name: rete
# Fixed, so the volumes below are shared by every invocation from this checkout
# — and, less obviously, by every OTHER worktree of the repository: they all
# resolve to the same `rete_cargo-target` and build into the same /target.
# Working in a second checkout (or running two gates at once)? Give it its own
# project and its own volumes come with it:
#
#     export COMPOSE_PROJECT_NAME=my-worktree
#
# tests/gate/fixtures.sh shells out to `docker compose run --rm dev`, so this
# applies to `bash tests/gate/gate.sh` too. See tests/gate/README.md.

x-rete-dev: &rete-dev
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  working_dir: /work
  environment:
    CARGO_TARGET_DIR: /target
    CARGO_TERM_COLOR: always
  volumes:
    - .:/work
    - cargo-registry:/usr/local/cargo/registry
    - cargo-target:/target

x-rete-r: &rete-r
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile.r
  working_dir: /work/clients/r
  environment:
    # No CARGO_TARGET_DIR here: src/Makevars.in pins `--target-dir ./rust/target`
    # on the cargo command line (CRAN wants a self-contained build), which wins
    # over the env var. Those artifacts are multi-GB and gitignored; run
    # `clients/r/cleanup` to reclaim the space.
    CARGO_TERM_COLOR: always
  volumes:
    - .:/work
    # Only the registry is shared — the build tree has to live in the package.
    - r-cargo-registry:/usr/local/cargo/registry

x-rete-gate: &rete-gate
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  working_dir: /work/tests/gate
  network_mode: host
  volumes:
    - .:/work

services:
  volume-init:
    <<: *rete-dev
    user: root
    command: ["sh", "-lc", "chown -R 1000:1000 /usr/local/cargo/registry /target"]

  dev:
    <<: *rete-dev
    user: vscode
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["sleep", "infinity"]

  check:
    <<: *rete-dev
    user: vscode
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["bash", "scripts/release_check.sh"]

  docs:
    <<: *rete-dev
    user: vscode
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["python3", "-m", "http.server", "8000", "--directory", "docs"]
    ports: ["8000:8000"]

  wasm:
    <<: *rete-dev
    user: vscode
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["bash", "scripts/build_wasm.sh"]

  wasm-async:
    <<: *rete-dev
    user: vscode
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["bash", "scripts/build_playground_async.sh"]

  # `R/extendr-wrappers.R` is generated — regenerate it here after changing
  # anything inside `extendr_module!`. Separate image (see the Dockerfile) so the
  # main dev image every CI job builds stays free of the R package tree.
  # Its own cargo volumes: this container runs as root, and sharing the dev
  # service's volumes would leave root-owned files behind for the vscode user.
  r:
    <<: *rete-r
    command: ["Rscript", "-e", "rextendr::document()"]

  r-test:
    <<: *rete-r
    command:
      ["Rscript", "-e", "rextendr::document(); testthat::test_local()"]

  # Pure-Java client: multi-stage build compiles the C-ABI crate to wasm, drops
  # it into the JAR resources, and runs `mvn verify` (Chicory runs the wasm in
  # the JVM). Self-contained — no shared cargo/maven volumes, no host toolchain.
  #   docker compose run --rm java
  java:
    build:
      context: .
      dockerfile: clients/java/Dockerfile
    command: ["mvn", "-B", "-o", "verify"]

  gate:
    <<: *rete-gate
    environment:
      RETE_BROWSER: chromium
    command: ["bash", "-lc", "npm ci --no-audit --no-fund && node run.mjs"]

  gate-firefox:
    <<: *rete-gate
    profiles: ["extended-tests"]
    environment:
      RETE_BROWSER: firefox
    command: ["bash", "-lc", "npm ci --no-audit --no-fund && node run.mjs"]

  gate-catalog:
    <<: *rete-gate
    profiles: ["extended-tests"]
    environment:
      RETE_BROWSER: chromium
    command: ["bash", "-lc", "npm ci --no-audit --no-fund && node run.mjs --catalog=embedded"]

  gate-catalog-live:
    <<: *rete-gate
    profiles: ["extended-tests"]
    environment:
      RETE_BROWSER: chromium
    command: ["bash", "-lc", "npm ci --no-audit --no-fund && node run.mjs --catalog=all"]

volumes:
  cargo-registry:
  cargo-target:
  r-cargo-registry:
  r-cargo-target:
